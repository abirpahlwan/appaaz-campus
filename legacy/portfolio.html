const AUDIO_PREF_KEY = 'pahlwan-village-audio-v1';
const AudioManager = (() => {
  let ctx = null, master = null, bgmGain = null, bgmTimer = 0, bgmStep = 0;
  let muted = false, volume = 0.55, hidden = document.hidden, biome = 'village';
  const active = new Set();
  const motifs = {
    village:[261.63,329.63,392,329.63,293.66,349.23,440,349.23],
    mountain:[196,246.94,293.66,392,329.63,246.94,220,293.66],
    water:[220,277.18,329.63,415.3,329.63,277.18,246.94,277.18],
    desert:[185,233.08,277.18,311.13,277.18,233.08,207.65,233.08]
  };
  const presets = {
    ui:{freq:660,type:'square',duration:.08,gain:.035},
    building:{freq:392,type:'triangle',duration:.16,gain:.05},
    landmark:{freq:246.94,type:'sine',duration:.28,gain:.055},
    animal:{freq:520,type:'sine',duration:.14,gain:.045,second:780},
    summit:{freq:880,type:'sine',duration:.34,gain:.05,second:1174.66},
    transport:{freq:185,type:'sawtooth',duration:.28,gain:.04,second:370},
    environment:{freq:310,type:'triangle',duration:.2,gain:.04,second:465},
    success:{freq:880,type:'sine',duration:.22,gain:.06,second:1320},
    failure:{freq:180,type:'square',duration:.16,gain:.04,second:130}
  };
  function readPrefs(){
    try{
      const p=JSON.parse(localStorage.getItem(AUDIO_PREF_KEY)||'null');
      if(p && typeof p==='object'){
        muted=p.muted===true;
        if(Number.isFinite(p.volume)) volume=Math.max(0,Math.min(1,p.volume));
      }
    }catch(e){}
  }
  function writePrefs(){ try{ localStorage.setItem(AUDIO_PREF_KEY,JSON.stringify({muted,volume})); }catch(e){} }
  function ensure(){
    if(ctx) return ctx;
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    try{
      ctx=new Ctx();
      master=ctx.createGain(); master.gain.value=muted?0:volume; master.connect(ctx.destination);
      bgmGain=ctx.createGain(); bgmGain.gain.value=0.16; bgmGain.connect(master);
      return ctx;
    }catch(e){ ctx=null; return null; }
  }
  function unlock(){
    const c=ensure();
    if(c && c.state==='suspended') c.resume().catch(()=>{});
    return !!c;
  }
  function setMuted(next){
    muted=!!next;
    if(muted) stopBgm();
    if(master) master.gain.setTargetAtTime(muted?0:volume,ctx.currentTime,.02);
    writePrefs();
    if(!muted && document.getElementById('intro').style.display==='none') startBgm();
  }
  function setVolume(next){ volume=Math.max(0,Math.min(1,Number(next)||0)); if(master&&!muted) master.gain.setTargetAtTime(volume,ctx.currentTime,.02); writePrefs(); }
  function add(node){ active.add(node); node.addEventListener('ended',()=>active.delete(node),{once:true}); }
  function tone(freq,type,duration,gain,when,output){
    if(!ctx || muted || hidden) return;
    const now=Math.max(ctx.currentTime,when||ctx.currentTime), o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,now);
    g.gain.setValueAtTime(Math.max(.0001,gain),now);
    g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    o.connect(g); g.connect(output||master); add(o); o.start(now); o.stop(now+duration+.02);
  }
  function play(name, options){
    const p=presets[name]||presets.ui, c=unlock();
    if(!c || muted || hidden) return;
    const o=options||{}, when=ctx.currentTime+.005;
    tone(o.frequency||p.freq,p.type||p.type,p.duration||p.duration,(o.gain||p.gain),when);
    if(o.second||p.second) tone(o.second||p.second,p.type||p.type,(o.duration||p.duration)*.8,(o.gain||p.gain)*.7,when+.025);
  }
  function scheduleBgm(){
    if(!ctx || muted || hidden || document.getElementById('intro').style.display!=='none') return;
    const notes=motifs[biome]||motifs.village, f=notes[bgmStep++%notes.length];
    tone(f,'sine',.42,.018,ctx.currentTime+.02,bgmGain);
    tone(f*2,'triangle',.18,.006,ctx.currentTime+.05,bgmGain);
    bgmTimer=window.setTimeout(scheduleBgm, reducedMotion?1100:760);
  }
  function startBgm(){
    if(!unlock() || bgmTimer || hidden) return;
    scheduleBgm();
  }
  function stopBgm(){ if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer=0; } }
  function setBiome(next){ biome=motifs[next]?next:'village'; }
  function pause(){ hidden=true; stopBgm(); if(ctx&&ctx.state==='running') ctx.suspend().catch(()=>{}); }
  function resume(){ hidden=false; if(ctx&&ctx.state==='suspended') ctx.resume().catch(()=>{}); if(document.getElementById('intro').style.display==='none') startBgm(); }
  function dispose(){
    stopBgm(); active.forEach(n=>{try{n.stop();}catch(e){}}); active.clear();
    if(ctx){ ctx.close().catch(()=>{}); ctx=null; master=null; bgmGain=null; }
  }
  readPrefs();
  return {unlock,play,startBgm,stopBgm,setBiome,setMuted,setVolume,isMuted:()=>muted,getVolume:()=>volume,pause,resume,dispose};
})();

    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);
  try{ track('contact:mailto'); }catch(err){}
  window.location.href = url;
}
function copyEmail(btn){
  const done = ()=>{
    if(btn){
      const t = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(()=>{ btn.textContent = t; }, 1600);
    } else toast('Copied ' + CONTACT_EMAIL);
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(CONTACT_EMAIL).then(done, ()=>fallbackCopy(done));
    } else fallbackCopy(done);
  }catch(err){ fallbackCopy(done); }
}
function fallbackCopy(done){
  try{
    const ta = document.createElement('textarea');
    ta.value = CONTACT_EMAIL;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }catch(err){ window.prompt('Copy this address:', CONTACT_EMAIL); }
}

function buildClassic(){
  document.getElementById('cName').textContent=CONTENT.name;
  document.getElementById('cRole').textContent=CONTENT.role;
  document.getElementById('cBlurb').textContent=CONTENT.blurb;
  const host=document.getElementById('cSections'); host.innerHTML='';
  CONTENT.objects.filter(o=>!o.secret).forEach(o=>{
    const s=document.createElement('section'); s.className='sec';
    s.innerHTML=`<h2>${o.title}</h2><div class="card-body">${o.html}</div>`;
    host.appendChild(s);
  });
}
function toggleClassic(force){
  const c=document.getElementById('classic');
  const on = force!==undefined ? force : !c.classList.contains('on');
  c.classList.toggle('on', on);
  document.getElementById('hud').style.display = on ? 'none' : 'block';
  if(on){ AudioManager.stopBgm(); closeModal(); document.getElementById('intro').style.display='none'; c.scrollTop=0;
          track('skip-to-plain-version'); }
  else if(document.getElementById('intro').style.display==='none') AudioManager.startBgm();
}

document.getElementById('whoami').textContent    = CONTENT.name;
document.getElementById('introName').textContent = CONTENT.name;
document.getElementById('introSub').textContent  = CONTENT.tagline;
document.getElementById('btnClassic').onclick    = ()=>toggleClassic(true);
document.getElementById('btnBackGame').onclick   = ()=>toggleClassic(false);
const classicLnk=document.getElementById('lnkClassic'); if(classicLnk) classicLnk.onclick=e=>{e.preventDefault(); toggleClassic(true);};
const soundButton=document.getElementById('btnSound');
const volumeControl=document.getElementById('audioVolume');
soundButton.textContent=soundOn?'♪ on':'♪ off';
volumeControl.value=String(AudioManager.getVolume());
soundButton.onclick      = e=>{ soundOn=!soundOn; AudioManager.setMuted(!soundOn); e.target.textContent=soundOn?'♪ on':'♪ off'; if(soundOn) AudioManager.play('ui'); };
volumeControl.addEventListener('input', e=>AudioManager.setVolume(e.target.value));
document.getElementById('btnHelp').onclick       = ()=>openModal('How to explore','controls',
  `<ul>
     <li><b>Move</b> — WASD or arrow keys (drag the on-screen stick on mobile)</li>
     <li><b>Go inside</b> — walk through a lit doorway; the roof lifts off</li>
     <li><b>Interact</b> — stand by something glowing and press <b>E</b> / <b>Space</b></li>
     <li><b>Close</b> — <b>Esc</b>, or click outside the panel</li>
     <li><b>Plain version</b> — press <b>M</b> or hit "Skip the game"</li>
   </ul>
   <p>Eight buildings and ${objs.filter(o=>!o.secret).length} things to read. There are also
   <b>${objs.filter(o=>o.secret).length} hidden things</b> out in the village that say more about me
   than about the work \u2014 they glimmer faintly, so keep an eye on the grass.</p>`, 'wave');
const spd=document.getElementById('spd'), spdVal=document.getElementById('spdVal');
function setSpeed(v){ P.speed=parseFloat(v); spdVal.textContent=P.speed.toFixed(1)+'\u00d7'; }
spd.addEventListener('input', e=>setSpeed(e.target.value));
setSpeed(spd.value);
/* keep the keyboard on the game, not the slider */
spd.addEventListener('keydown', e=>e.preventDefault());
spd.addEventListener('change', ()=>spd.blur());

document.getElementById('btnStart').onclick = ()=>{
  AudioManager.unlock();
  document.getElementById('intro').style.display='none';
  toast('Walk through a doorway to go inside'); AudioManager.play('success',{frequency:880}); AudioManager.startBgm();
  track('start-playing');
};

document.addEventListener('visibilitychange', ()=>document.hidden ? AudioManager.pause() : AudioManager.resume());
addEventListener('pagehide', ()=>AudioManager.dispose(), {once:true});

/* ------------------------------------------------------------------
   Touch controls.

   The stick is "floating": put a finger down anywhere on the left side of
   the screen and the stick jumps to that spot, so you never have to look
   for it. Touches are tracked by identifier, so you can steer and tap LOOK
   at the same time.
   ------------------------------------------------------------------ */
const stick = document.getElementById('stick');
const nub   = document.getElementById('nub');
const abtn  = document.getElementById('abtn');
const STICK_MAX = 46;
let stickId = null, sc = {x:0, y:0}, homeStick = true;

function isUiTarget(t){
  return !!(t && t.closest && t.closest('button, a, input, textarea, select, #modal, #classic'));
}
function placeStick(x, y){
  stick.style.left = (x - 62) + 'px';
  stick.style.top  = (y - 62) + 'px';
  stick.style.bottom = 'auto';
  stick.classList.add('live');
  homeStick = false;
}
function restStick(){
  stick.style.left = '26px';
  stick.style.top = 'auto';
  stick.style.bottom = '26px';
  stick.classList.remove('live');
  nub.style.transform = '';
  homeStick = true;
}
function applyStick(t){
  let dx = t.clientX - sc.x, dy = t.clientY - sc.y;
  const d = Math.hypot(dx, dy);
  if(d > STICK_MAX){ dx = dx/d*STICK_MAX; dy = dy/d*STICK_MAX; }
  nub.style.transform = `translate(${dx}px,${dy}px)`;
  touchVec = {x: dx/STICK_MAX, y: dy/STICK_MAX};
}

addEventListener('touchstart', e=>{
  if(!matchMedia('(pointer:coarse)').matches) return;
  for(const t of e.changedTouches){
    if(isUiTarget(t.target)) continue;                 // buttons and panels keep their taps
    if(stickId !== null) continue;
    if(t.clientX > innerWidth*0.58) continue;          // right side is for LOOK
    if(t.clientY < 96) continue;                       // keep clear of the HUD
    stickId = t.identifier;
    placeStick(t.clientX, t.clientY);
    sc = {x: t.clientX, y: t.clientY};
    applyStick(t);
  }
}, {passive:true});

addEventListener('touchmove', e=>{
  if(stickId === null) return;
  for(const t of e.changedTouches){
    if(t.identifier !== stickId) continue;
    applyStick(t);
  }
}, {passive:true});

function endStick(e){
  if(stickId === null) return;
  for(const t of e.changedTouches){
    if(t.identifier !== stickId) continue;
    stickId = null;
    touchVec = {x:0, y:0};
    restStick();
  }
}
addEventListener('touchend', endStick, {passive:true});
addEventListener('touchcancel', endStick, {passive:true});

/* LOOK: fire on touchstart so it feels instant, and don't let the same tap
   also count as a click afterwards. */
let lookLock = 0;
function pressLook(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const now = Date.now();
  if(now - lookLock < 250) return;
  lookLock = now;
  abtn.style.transform = 'translateY(3px)';
  setTimeout(()=>{ abtn.style.transform=''; }, 120);
  if(navigator.vibrate) { try{ navigator.vibrate(12); }catch(err){} }
  tryInteract();
}
abtn.addEventListener('touchstart', pressLook, {passive:false});
abtn.addEventListener('click', e=>{
  if(Date.now() - lookLock < 400) return;   // already handled by the touch
  pressLook(e);
});

/* tapping the dimmed area outside a panel closes it on touch too */
modal.addEventListener('touchstart', e=>{
  if(e.target === modal) closeModal();
}, {passive:true});

buildClassic();
updateFound();
resize();
loop();
</script>
