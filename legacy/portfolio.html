  mountainPath:'#c8b7a5',
  mountainDk:'#5d6c99', desert:'#e0bd76', desertHi:'#ffd8a8',
  water:'#46d6ea', waterHi:'#c2fbf2', rail:'#8f7360', railHi:'#e6c298',
  garden:'#6fbf6a', gardenHi:'#d4f4b0',
  white:'#ffffff', cream:'#fff6e2',
  cow:'#fdfdfd', cowDk:'#e6e6ee', spot:'#3b3038', snout:'#f2a9b8',
  duck:'#ffd23f', duckDk:'#f0b429', bill:'#f2803c',
  skin:'#e9b183', skinDk:'#d59a69', hair:'#1b1a20', hairHi:'#3a3844',
  shirt:'#3e7d4f', shirtDk:'#2f613d', collar:'#f4f2e8', jeans:'#39404f',
  lens:'#cfe4f2', frame:'#2b2b33',
  gold:'#EAB308', goldHi:'#FDE047', leaf:'#4ADE80', aqua:'#7DD3FC'
};
BUILDINGS[0].roof='#3fae7c'; BUILDINGS[1].roof='#2fa3a0'; BUILDINGS[2].roof='#3d9bd6';
BUILDINGS[3].roof='#f0b429'; BUILDINGS[4].roof='#3fbf72'; BUILDINGS[5].roof='#38bdf8';
BUILDINGS[6].roof='#d08a4e'; BUILDINGS[7].roof='#2fbfae';

let T = 0;
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+255*amt))|0; g=Math.max(0,Math.min(255,g+255*amt))|0; b=Math.max(0,Math.min(255,b+255*amt))|0;
  return `rgb(${r},${g},${b})`;
}
function rr(x,y,w,h,r){
  r=Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function ell(cx,cy,rx,ry){
  ctx.beginPath();
  ctx.ellipse(cx, cy, Math.max(0.01, rx||0), Math.max(0.01, ry||0), 0, 0, 6.2832);
}
function ink(w){ ctx.strokeStyle=C.ink; ctx.lineWidth=w||1.3; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke(); }
function fill(c){ ctx.fillStyle=c; ctx.fill(); }
function blob(cx,cy,rx,ry,c,line){
  if(rx<=0||ry<=0) return;
  ell(cx,cy,rx,ry); fill(c); if(line!==false) ink(line||1.3);
}
function drop(cx,cy,rx,ry,a){
  ctx.fillStyle=`rgba(46,34,24,${a||0.18})`;
  ell(cx,cy,rx,ry); ctx.fill();
}
function label(text,x,y,c,size){
  ctx.font=`bold ${size||7}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign='center'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(255,252,240,.92)'; ctx.lineWidth=2.6; ctx.strokeText(text,x,y);
  ctx.fillStyle=c||C.ink; ctx.fillText(text,x,y);
  ctx.textAlign='left';
}

/* ---------------- terrain ---------------- */
function drawTerrain(x0,y0,x1,y1){
  /* one flat sweep of grass, then character on top */
  px(x0*TILE, y0*TILE, (x1-x0)*TILE, (y1-y0)*TILE, C.grass);
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const t=map[y][x], X=x*TILE, Y=y*TILE, r=hash(x,y);
    if(t===GRASS || t===TREE){
      if(r>0.80){ blob(X+8+(r-0.8)*20, Y+8, 9, 7, C.grass2, false); }
      else if(r<0.12){ blob(X+7, Y+9, 7, 5, C.grassHi, false); }
    }
  }
  /* faceted mountain footholds keep the peak region distinct without extra assets */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==ROCK || y>=20 || x<64) continue;
    const X=x*TILE, Y=y*TILE, r=hash(x+31,y+17);
    px(X,Y,TILE,TILE,r>.5?C.mountainDk:C.mountain);
    ctx.globalAlpha=.55;
    ctx.beginPath(); ctx.moveTo(X+2,Y+TILE-2); ctx.lineTo(X+8,Y+3); ctx.lineTo(X+14,Y+TILE-2); ctx.closePath();
    fill(r>.5?C.mountain:C.mountainHi); ctx.globalAlpha=1;
  }
  /* alpine meadow flowers and a tiny, non-blocking meltwater glint */
  for(let y=Math.max(y0,6);y<Math.min(y1,15);y++) for(let x=Math.max(x0,66);x<Math.min(x1,88);x++){
    if(map[y][x]!==GRASS || hash(x+71,y+13)<.91) continue;
    const X=x*TILE, Y=y*TILE, hue=['#f6c7df','#f7e38b','#b9dcff'][(x+y)%3];
    blob(X+5+(hash(y,x)*6),Y+10,1.1,1.1,hue,false);
    ctx.strokeStyle='#87b879'; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(X+6,Y+12); ctx.lineTo(X+6,Y+8); ctx.stroke();
  }
  if(y0<=14 && y1>=8 && x0<=84 && x1>=72){
    ctx.strokeStyle='rgba(184,244,240,.72)'; ctx.lineWidth=1.2; ctx.beginPath();
    ctx.moveTo(72*TILE,14*TILE); ctx.quadraticCurveTo(78*TILE,12*TILE,84*TILE,14*TILE); ctx.stroke();
  }
  /* terrace contour ring hugs the mountain massif + white banks rim the water.
     Layout-agnostic: survives the tile-map reshape, bakes once, free at runtime. */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const t=map[y][x];
    if(t!==GRASS && t!==PATH) continue;
    const X=x*TILE, Y=y*TILE;
    const is=(xx,yy,k)=> map[yy] && map[yy][xx]===k;
    if(is(x,y-1,ROCK)||is(x,y+1,ROCK)||is(x-1,y,ROCK)||is(x+1,y,ROCK)){
      ctx.fillStyle=C.grassDk;
      if(is(x,y-1,ROCK)) ctx.fillRect(X,Y,TILE,2);
      if(is(x,y+1,ROCK)) ctx.fillRect(X,Y+TILE-2,TILE,2);
      if(is(x-1,y,ROCK)) ctx.fillRect(X,Y,2,TILE);
      if(is(x+1,y,ROCK)) ctx.fillRect(X+TILE-2,Y,2,TILE);
    }
    if(is(x,y-1,WATER)||is(x,y+1,WATER)||is(x-1,y,WATER)||is(x+1,y,WATER)){
      ctx.fillStyle='#f7efda';
      if(is(x,y-1,WATER)) ctx.fillRect(X,Y,TILE,2);
      if(is(x,y+1,WATER)) ctx.fillRect(X,Y+TILE-2,TILE,2);
      if(is(x-1,y,WATER)) ctx.fillRect(X,Y,2,TILE);
      if(is(x+1,y,WATER)) ctx.fillRect(X+TILE-2,Y,2,TILE);
    }
  }
  /* dirt paths */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==PATH) continue;
    const X=x*TILE, Y=y*TILE, r=hash(x,y);
    const alpinePath = x>=68 && y<20;
    px(X,Y,TILE,TILE,alpinePath ? C.mountainPath : C.dirt);
    if(y>0        && map[y-1][x]!==PATH) px(X,Y,TILE,2,C.dirtDk);
    if(y<MAP_H-1  && map[y+1][x]!==PATH) px(X,Y+TILE-2,TILE,2,C.dirtDk);
    if(x>0        && map[y][x-1]!==PATH) px(X,Y,2,TILE,C.dirtDk);
    if(x<MAP_W-1  && map[y][x+1]!==PATH) px(X+TILE-2,Y,2,TILE,C.dirtDk);
    if(r>0.86) blob(X+5+r*6, Y+5+hash(y,x)*6, 2.2, 1.6, C.dirt2, false);
    if(alpinePath && r>0.58){
      blob(X+4+hash(y,x)*7,Y+3+hash(x+4,y+2)*3,2.8,1.1,C.snowBank,false);
    }
  }
  /* desert */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==DESERT) continue;
    const X=x*TILE, Y=y*TILE, r=hash(x,y);
    px(X,Y,TILE,TILE,C.desert);
    if(r>0.84) blob(X+6+r*6,Y+5+hash(y,x)*6,2,1.4,C.desertHi,false);
    if(r<0.10) blob(X+8,Y+8,1.2,1.2,'#b87c62',false);
  }
  /* tilled terrace sand, with a shaded riser where a step drops from turf */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==SAND) continue;
    const X=x*TILE, Y=y*TILE, r=hash(x,y);
    px(X,Y,TILE,TILE,C.sand);
    const above = map[y-1] && map[y-1][x];
    if(above===GRASS || above===PATH || above===TREE) px(X,Y,TILE,2,C.dirtDk);
    if(r>0.80) blob(X+5+r*6, Y+5+hash(y,x)*6, 2, 1.4, C.sandDk, false);
  }
  /* rail tracks */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==RAIL) continue;
    const X=x*TILE, Y=y*TILE;
    px(X,Y,TILE,TILE,C.rail);
    px(X,Y+6,TILE,3,'#554b5d');
    if(x%3===0){ px(X+2,Y+2,2,12,C.railHi); px(X+TILE-4,Y+2,2,12,C.railHi); }
    px(X,Y+7,TILE,1.5,'#342f40'); px(X,Y+9,TILE,1.5,'#342f40');
  }
  /* runway */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==RUNWAY) continue;
    const X=x*TILE, Y=y*TILE;
    px(X,Y,TILE,TILE,'#56687e');
    if(y===54 && x%4<2) px(X+4,Y+7,8,2,C.waterHi);
  }
  /* interior floorboards */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==FLOOR) continue;
    const X=x*TILE, Y=y*TILE;
    px(X,Y,TILE,TILE, (y%2===0) ? '#eed3a6' : '#e6c795');
    ctx.strokeStyle='rgba(122,76,47,.30)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X,Y+0.5); ctx.lineTo(X+TILE,Y+0.5); ctx.stroke();
    const r=hash(x,y);
    if(r>0.5){ ctx.beginPath(); ctx.moveTo(X+((r*TILE)|0)+0.5,Y); ctx.lineTo(X+((r*TILE)|0)+0.5,Y+TILE); ctx.stroke(); }
  }
  /* walls */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    if(map[y][x]!==WALL) continue;
    const X=x*TILE, Y=y*TILE;
    px(X,Y,TILE,TILE,C.wall);
    const inner = (yy,xx)=> map[yy] && map[yy][xx]===FLOOR;
    if(inner(y+1,x)) px(X,Y+TILE-3,TILE,3,C.wallDk);
    if(inner(y-1,x)) px(X,Y,TILE,3,C.wallDk);
    if(inner(y,x+1)) px(X+TILE-3,Y,3,TILE,C.wallDk);
    if(inner(y,x-1)) px(X,Y,3,TILE,C.wallDk);
    ctx.strokeStyle='rgba(51,36,28,.55)'; ctx.lineWidth=1.4;
    if(!(map[y-1] && (map[y-1][x]===WALL||map[y-1][x]===FLOOR))){ ctx.beginPath(); ctx.moveTo(X,Y+0.7); ctx.lineTo(X+TILE,Y+0.7); ctx.stroke(); }
    if(!(map[y+1] && (map[y+1][x]===WALL||map[y+1][x]===FLOOR))){ ctx.beginPath(); ctx.moveTo(X,Y+TILE-0.7); ctx.lineTo(X+TILE,Y+TILE-0.7); ctx.stroke(); }
    if(!(map[y][x-1]===WALL||map[y][x-1]===FLOOR)){ ctx.beginPath(); ctx.moveTo(X+0.7,Y); ctx.lineTo(X+0.7,Y+TILE); ctx.stroke(); }
    if(!(map[y][x+1]===WALL||map[y][x+1]===FLOOR)){ ctx.beginPath(); ctx.moveTo(X+TILE-0.7,Y); ctx.lineTo(X+TILE-0.7,Y+TILE); ctx.stroke(); }
  }
  /* flat base under the water shader */
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++)
    if(map[y][x]===WATER) px(x*TILE,y*TILE,TILE,TILE,C.water);
  /* trees are drawn later, in the depth pass */
}

function paintTree(g,sway,v,fruit){
  const o=ctx; ctx=g;
  drop(0, 14, 7.5, 3.2, .20);
  rr(-1.8, 5, 3.6, 9, 1.4); fill(C.timber); ink(1.2);
  const cx=sway, cy=2.5;
  blob(cx-3.6, cy+2.6, 5.2, 4.6, C.grassDk);
  blob(cx+3.8, cy+2.4, 5.0, 4.4, C.grassDk);
  blob(cx, cy, 6.2, 5.6, v ? '#5fbf4d' : '#55a83e');
  blob(cx-1.8, cy-2.2, 2.6, 2.0, C.grassHi, false);
  if(fruit){ blob(cx+3.2,cy+1.4,1.3,1.3,'#ff6b6b',false); blob(cx-3.4,cy+3,1.3,1.3,'#ff6b6b',false); }
  ctx=o;
}

/* trees sway, so bake a handful of frames rather than redrawing the shapes */
const TSS=2, TSW=24, TSH=26, TOX=TSW/2, TOY=TSH-8, TSWAYS=7;
const TREE_SPR=[];
(function bakeTrees(){
  for(let v=0;v<2;v++) for(let f=0;f<2;f++) for(let k=0;k<TSWAYS;k++){
    const cv=document.createElement('canvas');
    cv.width=TSW*TSS; cv.height=TSH*TSS;
    const g=cv.getContext('2d');
    g.scale(TSS,TSS); g.translate(TOX,TOY);
    paintTree(g, (k/(TSWAYS-1))*2-1, v, f);
    TREE_SPR.push(cv);
  }
})();
function drawTree(t){
  const sway=Math.sin(T/44 + t.ph);
  let k=Math.round((sway+1)/2*(TSWAYS-1));
  k = k<0?0:(k>TSWAYS-1?TSWAYS-1:k);
  const spr=TREE_SPR[((t.v*2 + (t.fruit?1:0))*TSWAYS) + k];
  ctx.drawImage(spr, (t.x+8-TOX)|0, (t.y+8-TOY)|0, TSW, TSH);
}

/* ---------------- props ---------------- */
function drawProp(p){
  const x=p.x, y=p.y;
  switch(p.k){
    case 'bench':
      drop(x+8,y+14,7,2.4);
      rr(x+1.5,y+7,13,3.4,1.6); fill(C.timber); ink(1.2);
      rr(x+1.5,y+2.5,13,3.6,1.6); fill('#b07a4e'); ink(1.2);
      rr(x+2.5,y+10,2,4,1); fill(C.timberDk); ink(1.1);
      rr(x+11.5,y+10,2,4,1); fill(C.timberDk); ink(1.1);
      break;
    case 'lamp':
      drop(x+8,y+15,4,2);
      rr(x+7,y+3,2,12,1); fill('#6b7c8c'); ink(1.2);
      rr(x+4,y-4,8,7,2.5); fill('#ffe08a'); ink(1.3);
      blob(x+6.5,y-1.5,1.6,1.6,C.white,false);
      rr(x+5,y-6,6,2,1); fill('#6b7c8c'); ink(1.1);
      break;
    case 'crate':
      drop(x+8,y+15,6.5,2.2);
      rr(x+2,y+3,12,12,2.2); fill('#c9954f'); ink(1.3);
      px(x+2.5,y+8,11,1.6,C.timberDk);
      px(x+7.2,y+3.5,1.6,11,C.timberDk);
      blob(x+5,y+5.5,1.6,1.2,'#e0b071',false);
      break;
    case 'barrel':
      drop(x+8,y+15,5.5,2.2);
      rr(x+3.5,y+2,9,13,3); fill('#b5773f'); ink(1.3);
      px(x+3.8,y+5,8.4,1.6,C.timberDk); px(x+3.8,y+10,8.4,1.6,C.timberDk);
      ell(x+8,y+2.6,4.5,1.8); fill('#cf9052'); ink(1.2);
      break;
    case 'haybale':
      drop(x+8,y+15,7,2.4);
      rr(x+1.5,y+4,13,11,4); fill('#f0cf6a'); ink(1.3);
      ctx.strokeStyle='rgba(51,36,28,.35)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+3,y+9); ctx.lineTo(x+13,y+9); ctx.stroke();
      blob(x+5,y+6.5,2.2,1.3,'#f8e08f',false);
      break;
    case 'rock':
      drop(x+8,y+14,6,2.2);
      ctx.beginPath();
      ctx.moveTo(x+2.5,y+13); ctx.lineTo(x+4,y+6); ctx.lineTo(x+8,y+3.5);
      ctx.lineTo(x+12.5,y+6.5); ctx.lineTo(x+13.5,y+13); ctx.closePath();
      fill('#9aa7b4'); ink(1.3);
      ctx.beginPath(); ctx.moveTo(x+5,y+6.6); ctx.lineTo(x+8,y+4.6); ctx.lineTo(x+10,y+6.4);
      ctx.closePath(); fill('#bcc7d2');
      break;
    case 'bush':
      drop(x+8,y+14,6.5,2.2);
      blob(x+5,y+9,4.6,4.2,C.grassDk);
      blob(x+11,y+9,4.4,4.0,C.grassDk);
      blob(x+8,y+7,5.4,4.8,'#59ba49');
      blob(x+6.4,y+5.4,2,1.5,C.grassHi,false);
      if(hash(p.tx,p.ty)>0.5){ blob(x+10,y+8,1.4,1.4,'#ff5f8d',false); blob(x+6,y+10,1.4,1.4,'#ff5f8d',false); }
      break;
    case 'flowers':
      for(let i=0;i<4;i++){
        const fx=x+3+i*3.6, fy=y+6+((i%2)*4), col=['#ffd23f','#ff5f8d','#7ab8ff','#ff8c42'][i%4];
        ctx.strokeStyle=C.grassDk; ctx.lineWidth=1.1;
        ctx.beginPath(); ctx.moveTo(fx,fy+5); ctx.lineTo(fx,fy+1); ctx.stroke();
        blob(fx,fy,1.9,1.9,col);
        blob(fx,fy,0.7,0.7,'#fff5c2',false);
      } break;
    case 'sign':
      drop(x+8,y+15,4,1.8);
      rr(x+7,y+7,2,8,1); fill(C.timberDk); ink(1.2);
      rr(x+0.5,y+0.5,15,8,2); fill('#d8a866'); ink(1.4);
      ctx.strokeStyle='rgba(51,36,28,.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+3,y+3.6); ctx.lineTo(x+12,y+3.6);
      ctx.moveTo(x+3,y+6); ctx.lineTo(x+9,y+6); ctx.stroke();
      break;
  }
}

function drawMountainFeature(f){
  const x=f.x, y=f.y, glow=near===f;
  ctx.save();
  if(f.feature==='sign'){
    rr(x+3,y+5,10,5,1); fill(glow?C.mountainGlow:'#d9b77d'); ink(1);
    rr(x+7,y+9,2,7,1); fill(C.timberDk); ink(1);
    blob(x+2,y+14,4,1.2,C.snowBank,false);
    ctx.strokeStyle=C.inkSoft; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(x+5,y+7); ctx.lineTo(x+11,y+7); ctx.stroke();
  } else if(f.feature==='bridge'){
    ctx.strokeStyle='#b78c63'; ctx.lineWidth=1.2; ctx.beginPath();
    ctx.moveTo(x+1,y+3); ctx.lineTo(x+31,y+3); ctx.moveTo(x+1,y+12); ctx.lineTo(x+31,y+12); ctx.stroke();
    for(let i=0;i<5;i++){ rr(x+2+i*7,y+5,5,5,1); fill(glow?C.mountainGlow:'#c69b70'); ink(.8); }
    blob(x+1,y+14,4,1.1,C.snowBank,false); blob(x+31,y+14,4,1.1,C.snowBank,false);
  } else if(f.feature==='overlook'){
    ctx.fillStyle='rgba(184,244,240,.22)'; ctx.beginPath(); ctx.arc(x+17,y+10,15,0,6.283); ctx.fill();
    ctx.globalAlpha=.45; blob(x+8,y+4,6,2.2,C.cloudHi,false); blob(x+19,y+3,8,2.5,C.cloudHi,false); ctx.globalAlpha=1;
    ctx.strokeStyle='#cfe4f2'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x+2,y+14); ctx.lineTo(x+10,y+7); ctx.lineTo(x+16,y+12); ctx.lineTo(x+25,y+5); ctx.stroke();
    blob(x+24,y+4,2.2,1.3,'#f4b6a5',false); ctx.strokeStyle='#f4b6a5'; ctx.beginPath(); ctx.moveTo(x+24,y+5); ctx.lineTo(x+24,y+10); ctx.stroke();
  } else if(f.feature==='camp'){
    blob(x+8,y+13,6,2,C.inkSoft,false); ctx.strokeStyle=C.timberDk; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(x+3,y+13); ctx.lineTo(x+13,y+13); ctx.moveTo(x+5,y+10); ctx.lineTo(x+11,y+14); ctx.stroke();
    blob(x+8,y+9+Math.sin(T/8),2.5,3.4,glow?C.snowBank:C.campGlow,false);
  } else if(f.feature==='telescope'){
    drop(x+8,y+15,6,2);
    ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x+8,y+11); ctx.lineTo(x+5,y+3); ctx.moveTo(x+8,y+11); ctx.lineTo(x+12,y+11); ctx.stroke();
    rr(x+3,y+1,10,4,1.5); fill(glow?C.waterHi:C.glass); ink(1.1);
    ctx.globalAlpha=.55; rr(x+4,y+1.7,4,1.2,.6); fill(C.white); ctx.globalAlpha=1;
  } else if(f.feature==='bell'){
    ctx.strokeStyle=C.timberDk; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(x+3,y+14); ctx.lineTo(x+3,y+3); ctx.lineTo(x+13,y+3); ctx.lineTo(x+13,y+14); ctx.stroke();
    rr(x+5,y+5,6,7,2); fill(glow?C.mountainGlow:'#e6b16b'); ink(1.2);
    ctx.beginPath(); ctx.moveTo(x+4,y+12); ctx.lineTo(x+12,y+12); ctx.stroke();
    blob(x+8,y+13.5,1.3,1.3,C.ink,false);
  } else if(f.feature==='hare'){
    const hop=Math.sin(T/12)*.7;
    blob(x+8,y+13+hop,5.2,3.2,'#f3f4fb',1.1);
    blob(x+4,y+10+hop,2.5,2.8,'#f3f4fb',1.1);
    blob(x+2.8,y+7.5+hop,1.1,2.5,'#d9e2f7',1);
    blob(x+6,y+9+hop,1,1,'#756f9d',false);
    if(glow){ ctx.globalAlpha=.25; blob(x+7,y+11+hop,7,5,C.waterHi,false); ctx.globalAlpha=1; }
  } else if(f.feature==='ptarmigan'){
    const flap=reducedMotion?0:Math.sin(T/7)*1.2;
    blob(x+8,y+10,4.4,3.2,'#f3f4fb',1);
    blob(x+4,y+9,2.6,2.2,'#f3f4fb',1);
    ctx.strokeStyle='#c7d8ff'; ctx.lineWidth=1.2; ctx.beginPath();
    ctx.moveTo(x+7,y+10); ctx.lineTo(x+4,y+7-flap); ctx.moveTo(x+9,y+10); ctx.lineTo(x+12,y+7+flap); ctx.stroke();
    ctx.fillStyle='#e8a46f'; ctx.beginPath(); ctx.moveTo(x+1,y+9); ctx.lineTo(x-2,y+10); ctx.lineTo(x+1,y+11); ctx.fill();
  } else if(f.feature==='marmot'){
    blob(x+8,y+11,4.5,3.7,'#9c745e',1); blob(x+5,y+8,2.8,2.7,'#b88768',1);
    blob(x+4.5,y+7.5,.7,.7,C.ink,false); blob(x+6,y+7.5,.7,.7,C.ink,false);
  }
  ctx.restore();
  label(f.label, x+8, y-3, glow?C.mountainGlow:C.ink, 6);
}

/* ---------------- interactables ---------------- */
function drawObj(o){
  const x=o.x, y=o.y, w=o.pw, h=o.ph;
  const glow=(near===o), acc=o.accent||'#ffd23f';
  const pop = glow ? 1+Math.sin(T/9)*0.03 : 1;
  ctx.save();
  ctx.translate(x+w/2, y+h); ctx.scale(pop,pop); ctx.translate(-(x+w/2), -(y+h));
  drop(x+w/2, y+h-1, w*0.44, 3);

  switch(o.kind){
    case 'desk':
      rr(x+2,y+h-11,w-4,11,2.5); fill(C.timber); ink(1.4);
      rr(x+4,y,w-8,h-9,2.5); fill('#c08552'); ink(1.4);
      px(x+5,y+2,w-10,1.6,'#d9a473');
      rr(x+w-23,y+1,18,13,2.5); fill('#43584f'); ink(1.4);
      rr(x+w-21,y+3,14,9,1.8); fill(glow?'#8ff0ff':C.glass);
      ctx.globalAlpha=.5; rr(x+w-20,y+4,5,7,1); fill(C.white); ctx.globalAlpha=1;
      rr(x+6,y+5,13,7,2); fill('#e6eaf2'); ink(1.3);
      rr(x+w-35,y+2,7,10,2); fill('#ff6b6b'); ink(1.3);
      break;

    case 'arcade': {
      rr(x,y+3,w,h-3,3); fill('#43584f'); ink(1.5);
      rr(x+1.5,y+6,w-3,13,2); fill('#232f2a'); ink(1.2);
      rr(x+2.5,y+7,w-5,11,1.6); fill(glow?acc:shade(acc,-.18));
      ctx.globalAlpha=.35; rr(x+3.5,y+8,(w-7)*0.4,9,1); fill(C.white); ctx.globalAlpha=1;
      rr(x+2,y+h-11,w-4,7,2); fill('#5b6辺'.slice(0,7)||'#5b6478'); ink(1.2);
      blob(x+6,y+h-7.5,1.9,1.9,'#ff5f8d'); blob(x+w-6,y+h-7.5,1.9,1.9,'#7ab8ff');
      rr(x+0.5,y-1,w-1,6,2.5); fill(acc); ink(1.4);
      ctx.globalAlpha=.45; rr(x+2,y+0.2,w-4,2,1); fill(C.white); ctx.globalAlpha=1;
      break;
    }

    case 'shelf':
    case 'cartridges': {
      rr(x,y,w,h,2.5); fill(C.timber); ink(1.5);
      px(x+1.5,y+h/2-0.8,w-3,1.6,C.timberDk);
      const cs=['#ff6b6b','#4cc9f0','#7ee787','#ffd23f','#c77dff','#06d6a0'];
      for(let i=0;i<w-7;i+=5){
        const k=(i/5|0);
        rr(x+3+i,y+2.5,3.6,h/2-4,1); fill(cs[k%6]); ink(1);
        rr(x+3+i,y+h/2+1.5,3.6,h/2-4,1); fill(cs[(k+3)%6]); ink(1);
      }
      break;
    }

    case 'board':
      rr(x,y,w,h,2.5); fill(C.white); ink(1.5);
      ctx.lineCap='round'; ctx.lineWidth=1.8;
      ['#43584f','#33bde0','#43584f','#ff6b6b'].forEach((c,i)=>{
        ctx.strokeStyle=c; ctx.beginPath();
        ctx.moveTo(x+5,y+5+i*4.4); ctx.lineTo(x+5+(w-12)*(0.92-i*0.16),y+5+i*4.4); ctx.stroke();
      });
      blob(x+w-5,y+h-4,1.6,1.6,'#ff5f8d');
      break;

    case 'trophy':
      rr(x,y+h-7,w,7,2); fill(C.timber); ink(1.4);
      rr(x+1,y,w-2,h-6,2.5); fill('#cfe6f2'); ink(1.4);
      ctx.globalAlpha=.45; rr(x+2,y+1,(w-4)*0.35,h-9,1.5); fill(C.white); ctx.globalAlpha=1;
      rr(x+7,y+4,6,7,1.5); fill(glow?'#ffe066':'#f0c419'); ink(1.3);
      rr(x+5.5,y+11,9,2,1); fill('#c9a227'); ink(1.1);
      blob(x+22,y+8,3,3.4,'#dfe7ef'); rr(x+19.5,y+11.5,7,2,1); fill('#b8c2cc'); ink(1.1);
      break;

    case 'terminal':
      rr(x+2,y+h-5,w-4,5,2); fill('#43584f'); ink(1.3);
      rr(x,y,w,h-4,2.5); fill('#36493f'); ink(1.5);
      rr(x+2,y+2,w-4,h-9,1.8); fill(glow?'#8bffb0':'#4fbe7a');
      ctx.strokeStyle='rgba(20,40,28,.55)'; ctx.lineWidth=1;
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(x+4,y+4.5+i*3); ctx.lineTo(x+4+(w-10)*(0.8-i*0.15),y+4.5+i*3); ctx.stroke(); }
      break;

    case 'rack':
      rr(x,y,w,h,2.5); fill('#43584f'); ink(1.5);
      for(let i=0;i<h-9;i+=5){
        rr(x+2,y+4+i,w-4,3.8,1.2); fill('#2f3purple'.slice(0,7)||'#2f3849'); ink(1);
        blob(x+4.6,y+5.9+i,1.1,1.1, glow?'#7ee787':'#4fbe7a',false);
        blob(x+8,y+5.9+i,1.1,1.1,(Math.floor(T/22)+i)%3===0?'#ffd23f':'#6b7c8c',false);
      }
      break;

    case 'arbench':
      rr(x,y+h-7,w,7,2.5); fill(C.timber); ink(1.4);
      rr(x+2.5,y+1,11,17,2.5); fill('#43584f'); ink(1.4);
      rr(x+4,y+2.5,8,14,1.8); fill(glow?'#8ff0ff':C.glass);
      rr(x+w-16,y+5,12,12,2); fill('#e8dcc0'); ink(1.3);
      blob(x+w-10,y+3, 3.4,3.0, glow?'#8ff0a8':'#69c97a');
      break;

    case 'vrrig':
      rr(x+w/2-8,y+h-6,16,6,2.5); fill('#6b7c8c'); ink(1.4);
      rr(x+w/2-2.5,y+h-15,5,10,2); fill('#8a9aa8'); ink(1.3);
      rr(x+3,y+1,w-6,14,5); fill(glow?'#6b7ae0':'#5b6ad0'); ink(1.5);
      rr(x+6,y+4,w-12,8,3); fill(glow?'#8ff0ff':'#232f2a'); ink(1.2);
      ctx.globalAlpha=.5; rr(x+7.5,y+5,4,5.5,1.5); fill(C.white); ctx.globalAlpha=1;
      rr(x+1,y+4,3,7,1.5); fill('#48579e'); ink(1.1);
      rr(x+w-4,y+4,3,7,1.5); fill('#48579e'); ink(1.1);
      break;

    case 'noticeboard':
      rr(x+3,y+h-9,3,9,1.2); fill(C.timberDk); ink(1.3);
      rr(x+w-6,y+h-9,3,9,1.2); fill(C.timberDk); ink(1.3);
      rr(x,y,w,h-7,3); fill(C.timber); ink(1.6);
      rr(x+2.5,y+2.5,w-5,h-12,2); fill(glow? '#fff6e2' : '#e8dcc0');
      for(let i=0;i<3;i++){
        const px0 = x+5 + i*((w-12)/3), py0 = y+5 + (i%2)*3;
        rr(px0, py0, (w-14)/3, 9, 1); fill(C.white); ink(1.1);
        ctx.strokeStyle='rgba(51,36,28,.45)'; ctx.lineWidth=.9;
        ctx.beginPath();
        ctx.moveTo(px0+1.5, py0+2.5); ctx.lineTo(px0+(w-14)/3-1.5, py0+2.5);
        ctx.moveTo(px0+1.5, py0+4.8); ctx.lineTo(px0+(w-14)/3-2.5, py0+4.8);
        ctx.moveTo(px0+1.5, py0+7.1); ctx.lineTo(px0+(w-14)/3-3.5, py0+7.1);
        ctx.stroke();
        blob(px0+(w-14)/6, py0-0.6, 1.1, 1.1, ['#ff5f8d','#4cc9f0','#ffd23f'][i], false);
      }
      rr(x+1,y-3.5,w-2,4,1.5); fill('#8a5a3b'); ink(1.4);
      break;

    case 'football':
      blob(x+8,y+8,5.4,5.4,C.white,1.5);
      ctx.save(); ell(x+8,y+8,5.4,5.4); ctx.clip();
      ctx.beginPath();
      ctx.moveTo(x+8,y+3.4); ctx.lineTo(x+11.6,y+6.2); ctx.lineTo(x+10.2,y+10.4);
      ctx.lineTo(x+5.8,y+10.4); ctx.lineTo(x+4.4,y+6.2); ctx.closePath();
      fill(C.ink);
      ctx.restore();
      if(glow){ ctx.globalAlpha=.3; blob(x+8,y+8,5.4,5.4,'#fff',false); ctx.globalAlpha=1; }
      break;
    case 'teacup':
      rr(x+3,y+6,9,7,2); fill(C.white); ink(1.4);
      rr(x+4,y+7,7,2.4,1); fill(glow?'#c98d4f':'#8a5a3b');
      ctx.strokeStyle=C.ink; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(x+12.6,y+9,2.2,-1.2,1.2); ctx.stroke();
      rr(x+2,y+13,11,2,1); fill('#cfd8e2'); ink(1.2);
      ctx.globalAlpha=.5;
      blob(x+6+Math.sin(T/22)*1,y+3.5,1.5,1.9,C.white,false);
      blob(x+9+Math.cos(T/19)*1,y+2.5,1.2,1.6,C.white,false);
      ctx.globalAlpha=1; break;
    case 'toybox':
      rr(x+1,y+5,w-2,9,2); fill('#e8563f'); ink(1.5);
      px(x+2,y+8,w-4,1.4,'#c23f2c');
      blob(x+5,y+4,2.4,2.4,'#ffd23f',1.2);
      rr(x+9,y+2,4,4,1); fill('#4cc9f0'); ink(1.2);
      blob(x+w-4,y+4,2,2,'#7ee787',1.2);
      break;
    case 'chess':
      rr(x+1,y+6,w-2,8,1.5); fill('#f2e2c4'); ink(1.5);
      for(let i=0;i<4;i++) for(let j=0;j<2;j++)
        if((i+j)%2===0) px(x+2+i*((w-4)/4), y+7+j*3, (w-4)/4, 3, '#5c4632');
      ctx.beginPath();
      ctx.moveTo(x+5,y+6); ctx.lineTo(x+6.5,y+1.5); ctx.lineTo(x+9,y+3);
      ctx.lineTo(x+8,y+6); ctx.closePath();
      fill(glow?'#fff':'#e8ecf5'); ink(1.3);
      break;
    case 'cricketbat':
      ctx.save(); ctx.translate(x+8,y+8); ctx.rotate(-0.42);
      rr(-2.2,-8,4.4,9,1.6); fill('#c9954f'); ink(1.4);
      rr(-1.2,1,2.4,6,1); fill('#3a4257'); ink(1.3);
      ctx.restore();
      blob(x+12,y+12,2.2,2.2,'#e8ecf5',1.2);
      break;
    case 'rickshaw':
      rr(x+3,y+4,w-7,6,2); fill('#2fa36b'); ink(1.5);
      rr(x+4,y+2,w-9,3,1.2); fill('#e8563f'); ink(1.3);
      blob(x+3.5,y+12,3.1,3.1,'#3a4257',1.4);
      blob(x+w-4,y+12,3.1,3.1,'#3a4257',1.4);
      blob(x+3.5,y+12,1,1,'#8a93a5',false);
      blob(x+w-4,y+12,1,1,'#8a93a5',false);
      px(x+w-3,y+6,2,5,'#8a5a3b');
      break;
    case 'landmark': {
      const acc2=o.accent||'#ffd23f';
      drop(x+w/2,y+h-1,w*0.46,3);
      if(o.id==='railway'){
        rr(x,y+h-6,w,6,2); fill(C.rail); ink(1.4);
        for(let i=0;i<w-3;i+=6){ rr(x+1.5+i,y+h-5.5,4,5,1); fill(C.railHi); ink(1); }
        rr(x+2,y+1,w-4,h-8,2); fill('#d97861'); ink(1.4);
        rr(x+4,y+3,w-8,4,1.5); fill(glow?C.desertHi:C.desert);
        rr(x+w/2-3,y-3,6,5,1.5); fill('#596d8b'); ink(1.3);
        rr(x+w/2-1.5,y-6,3,4,1); fill(C.waterHi); ink(1.2);
        ctx.globalAlpha=.35; rr(x+4,y+8,w-8,1.5,1); fill(C.white); ctx.globalAlpha=1;
      } else if(o.id==='aircraft'){
        ctx.save(); ctx.translate(x+w/2,y+h/2);
        rr(-w/2+2,-3,w-4,6,2); fill('#dbe8f1'); ink(1.4);
        ctx.beginPath(); ctx.moveTo(-w/2+4,-3); ctx.lineTo(-w/2-2,-10); ctx.lineTo(-w/2+8,-3);
        ctx.closePath(); fill('#a0b0c0'); ink(1.2);
        ctx.beginPath(); ctx.moveTo(w/2-4,-3); ctx.lineTo(w/2+2,-10); ctx.lineTo(w/2-8,-3);
        ctx.closePath(); fill('#a0b0c0'); ink(1.2);
        ctx.beginPath(); ctx.moveTo(-1,-3); ctx.lineTo(0,-14); ctx.lineTo(1,-3);
        ctx.closePath(); fill(acc2); ink(1.2);
        rr(-2,3,4,4,1); fill(C.water); ink(1.1);
        ctx.globalAlpha=.5; rr(-w/2+5,-1,w-10,1.5,.7); fill(C.white); ctx.globalAlpha=1;
        ctx.restore();
      } else if(o.id==='rocket'){
        ctx.save(); ctx.translate(x+w/2,y+h);
        rr(-5,-h+2,10,h-4,3); fill('#e8ecf5'); ink(1.5);
        rr(-3.5,-h+4,7,5,1.5); fill(glow?'#8ff0ff':C.glass);
        rr(-7,-4,4,6,1); fill(acc2); ink(1.2);
        rr(3,-4,4,6,1); fill(acc2); ink(1.2);
        ctx.beginPath(); ctx.moveTo(-4,-h+2); ctx.lineTo(0,-h-6); ctx.lineTo(4,-h+2);
        ctx.closePath(); fill('#ff5f8d'); ink(1.3);
        const flicker=Math.sin(T/3)*1.5;
        ctx.globalAlpha=.7; blob(0,2+flicker,3,4,'#ffd23f',false);
        blob(0,3+flicker,2,3,'#ff6b3b',false); ctx.globalAlpha=1;
        ctx.restore();
      } else if(o.id==='mountain'){
        const peakY=y-18;
        ctx.beginPath(); ctx.moveTo(x-10,y+h); ctx.lineTo(x+6,y+12); ctx.lineTo(x+w/2-2,peakY);
        ctx.lineTo(x+w/2+9,y+11); ctx.lineTo(x+w+12,y+h); ctx.closePath(); fill(C.mountainDk); ink(1.5);
        ctx.beginPath(); ctx.moveTo(x+2,y+h); ctx.lineTo(x+w/2,peakY+5); ctx.lineTo(x+w+6,y+h);
        ctx.closePath(); fill(C.mountain); ink(1.2);
        ctx.beginPath(); ctx.moveTo(x+w/2-7,peakY+9); ctx.lineTo(x+w/2,peakY); ctx.lineTo(x+w/2+8,peakY+10);
        ctx.closePath(); fill(C.snowBank);
        ctx.globalAlpha=.65; ctx.beginPath(); ctx.moveTo(x-2,y+8); ctx.lineTo(x+w/2-4,peakY+8); ctx.lineTo(x+w/2-1,peakY+12); ctx.lineTo(x+5,y+14); ctx.closePath(); fill(C.mountainGlow); ctx.globalAlpha=1;
        blob(x+4,y+h-1,8,1.5,C.snowBank,false);
        ctx.strokeStyle=C.ink; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(x+w/2+1,peakY); ctx.lineTo(x+w/2+1,peakY-9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+w/2+1,peakY-9); ctx.lineTo(x+w/2+8,peakY-6); ctx.lineTo(x+w/2+1,peakY-3); ctx.closePath(); fill('#f3c76b'); ink(1);
        for(let i=0;i<5;i++){
          const wx=x-5+((T*0.45+i*11)%38), wy=peakY+7+((i*13)%20);
          ctx.globalAlpha=.22+.08*Math.sin(T/9+i); blob(wx,wy,1.1,0.7,C.white,false);
        }
        ctx.globalAlpha=1;
      } else if(o.id==='dam'){
        rr(x,y+4,w,h-4,2); fill('#6d8595'); ink(1.5);
        px(x+1,y+h-6,w-2,2,'#6b7c8c');
        for(let i=0;i<w-4;i+=4){ rr(x+2+i,y+6,3,3,1); fill(glow?C.waterHi:C.water); ink(1); }
        rr(x-2,y+2,w+4,3,1.5); fill('#b6d7d7'); ink(1.3);
        const sp=Math.sin(T/8)*1;
        ctx.globalAlpha=.4; blob(x+w/2,y+h+sp,4,2,C.white,false); ctx.globalAlpha=1;
      } else if(o.id==='garden'){
        for(let i=0;i<3;i++) for(let j=0;j<3;j++){
          const fx=x+3+i*(w-6)/3, fy=y+3+j*(h-6)/3;
          rr(fx,fy,(w-8)/3,(h-8)/3,1); fill('#3a2a1c'); ink(.8);
          const fc=['#ff5f8d','#ffd23f','#7ab8ff','#c77dff','#7ee787','#ff8c42'][(i*3+j)%6];
          blob(fx+(w-8)/6,fy+(h-8)/6,2.2,2.2,fc);
          blob(fx+(w-8)/6,fy+(h-8)/6,0.8,0.8,'#fff5c2',false);
          if((i+j)%2===0){ ctx.globalAlpha=.35; rr(fx+1,fy+1,(w-10)/3,1.2,.6); fill(C.gardenHi); ctx.globalAlpha=1; }
        }
        ctx.strokeStyle=C.grassDk; ctx.lineWidth=1;
        for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+4+i*6,y+h-2); ctx.lineTo(x+4+i*6,y+h-5); ctx.stroke(); }
      } else {
        rr(x+2,y+2,w-4,h-4,3); fill(acc2); ink(1.5);
        blob(x+w/2,y+h/2,3,3,C.white,false);
      }
      break;
    }
    default:
      rr(x+4,y+8,8,7,2); fill('#c9954f'); ink(1.3);
      blob(x+8,y+4,4.4,4.0,'#59ba49'); blob(x+4.5,y+6,3,2.6,C.grassDk); blob(x+11,y+6,3,2.6,C.grassDk);
  }
  ctx.restore();

  if(!o.secret) label(o.label, x+w/2, y-4+(o.ldy||0), glow?'#c8541f':C.ink, 7);
  if(o.secret && !o.seen){
    const t = T/24 + (o.x+o.y);
    const a = 0.30 + Math.sin(t)*0.26;
    if(a > 0.06){
      ctx.save(); ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(x+w/2, y+h/2, 1, x+w/2, y+h/2, 15);
      g.addColorStop(0,'rgba(255,241,160,.85)'); g.addColorStop(1,'rgba(255,241,160,0)');
      ctx.fillStyle=g; ctx.fillRect(x+w/2-15, y+h/2-15, 30, 30);
      ctx.restore();
    }
  }
  if(!o.seen && !o.secret){
    const bob=Math.sin(T/16)*1.6, my=(o.ldy||0), bx=x+w/2, by=y-13+bob+my;
    ctx.save(); ctx.translate(bx,by);
    blob(0,0,4.6,5.4,'#ffd23f');
    ctx.fillStyle=C.ink; ctx.font='bold 8px system-ui, sans-serif'; ctx.textAlign='center';
    ctx.fillText('!',0,3); ctx.textAlign='left';
    ctx.restore();
  }
}

/* ---------------- buildings ----------------
   Facades and roofs are static art, so each one is painted once into its own
   offscreen canvas. Per frame we blit them and draw only the parts that move:
   the door light, the chimney smoke and the hanging sign.                    */

function paintFacade(g,b){
  const o=ctx; ctx=g;
  const fw=b.w*TILE;
  rr(0,6,fw,TILE+2,2); fill(C.wall); ink(1.6);
  px(1,6+TILE-4,fw-2,3,C.wallDk);
  for(let i=1;i<b.w-1;i++){
    if(b.x+i===b.door) continue;
    if(i%3!==1) continue;
    const wx=i*TILE;
    rr(wx+3,9.5,10,9,2); fill(C.glassDk); ink(1.3);
    rr(wx+4,10.5,8,7,1.5); fill(C.glass);
    ctx.globalAlpha=.75; ctx.beginPath();
    ctx.moveTo(wx+5,17); ctx.lineTo(wx+11,11); ctx.lineTo(wx+12,12.4);
    ctx.lineTo(wx+6.4,17.6); ctx.closePath(); fill(C.white); ctx.globalAlpha=1;
    rr(wx+2,18,12,3.4,1.2); fill(C.timber); ink(1.2);
    blob(wx+5,18.4,1.5,1.5,'#ff5f8d',false); blob(wx+8.5,18,1.5,1.5,'#ffd23f',false);
    blob(wx+11.5,18.6,1.5,1.5,'#7ab8ff',false);
  }
  /* cascading garden strips flank the door */
  const vine=(vx)=>{
    if(vx<4||vx+5>fw) return;
    ctx.strokeStyle='#2f613d'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(vx,5); ctx.lineTo(vx,TILE+6); ctx.stroke();
    for(let vy=7; vy<TILE+4; vy+=5){
      blob(vx-2.4,vy,2.2,1.8,C.leaf,false);
      blob(vx+2.4,vy+2.5,2.2,1.8,'#5fbf4d',false);
    }
  };
  const dx=(b.door-b.x)*TILE;
  vine(dx-16); vine(dx+TILE+10);
  /* striped awning + potted plants stay with the baked art */
  for(let i=0;i<4;i++){
    ctx.fillStyle = i%2 ? '#f2f2f2' : shade(b.roof,.06);
    ctx.beginPath(); ctx.moveTo(dx-3+i*5.5, 5); ctx.lineTo(dx+2.5+i*5.5, 5);
    ctx.lineTo(dx+1.5+i*5.5, 9.5); ctx.lineTo(dx-2+i*5.5, 9.5); ctx.closePath(); ctx.fill();
  }
  rr(dx-4,3.5,TILE+8,3,1.5); fill(shade(b.roof,-.08)); ink(1.4);
  [dx-7, dx+TILE+2].forEach(px0=>{
    rr(px0,15,6,6,1.5); fill('#c9784f'); ink(1.2);
    blob(px0+3,13,4,3.4,C.leaf);
  });
  ctx=o;
}

function paintRoofArt(g,b){
  const o=ctx; ctx=g;
  const rw=(b.w+2)*TILE, rh=(b.h+1)*TILE, ry=14;
  const cxp=rw-26;
  /* solar crown: panel fan + gold collector dome */
  rr(cxp-6,ry-5,21,6,2); fill('#0C4A6E'); ink(1.4);
  rr(cxp-4.5,ry-4,18,4,1); fill('#0EA5E9');
  px(cxp+2,ry-4,1.2,4,'#E0F2FE'); px(cxp+9,ry-4,1.2,4,'#E0F2FE');
  blob(cxp+4.5,ry-8,5,5,C.gold,false);
  blob(cxp+3,ry-9.5,1.6,1.6,C.goldHi,false);
  rr(0, ry, rw, rh-3, 7); fill('#FBF4E4'); ink(1.8);
  const ridge = ry + (rh-3)/2;
  ctx.save();
  rr(0, ry, rw, rh-3, 7); ctx.clip();
  for(let yy=ry+7; yy<ry+rh-3; yy+=7){
    ctx.fillStyle = yy<ridge ? '#F1E8CF' : '#E6D7B4';
    for(let xx=-6; xx<rw+6; xx+=11){
      const off=(((yy-ry)/7|0)%2)*5.5;
      ctx.beginPath(); ctx.ellipse(xx+off+5.5, yy, 6, 4.4, 0, Math.PI, 0); ctx.fill();
    }
  }
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillRect(0, ry, rw, (rh-3)/2 - 2);
  ctx.restore();
  rr(2, ridge-3.5, rw-4, 7, 3.5); fill(b.roof); ink(1.5);
  ctx=o;
}

const BSS = 2;
BUILDINGS.forEach(b=>{
  const fw=b.w*TILE;
  b.fcv=document.createElement('canvas');
  b.fcv.width=fw*BSS; b.fcv.height=(TILE+16)*BSS;
  const fg=b.fcv.getContext('2d'); fg.scale(BSS,BSS);
  paintFacade(fg,b);
  b.fx=b.x*TILE; b.fy=(b.y+b.h-1)*TILE-6; b.fw=fw; b.fh=TILE+16;

  const rw=(b.w+2)*TILE, rh=(b.h+1)*TILE;
  b.rcv=document.createElement('canvas');
  b.rcv.width=rw*BSS; b.rcv.height=(rh+14)*BSS;
  const rg=b.rcv.getContext('2d'); rg.scale(BSS,BSS);
  paintRoofArt(rg,b);
  b.rx=(b.x-1)*TILE; b.ry=(b.y-2)*TILE-14; b.rw=rw; b.rh=rh+14;
});

function drawFacade(b){
  ctx.drawImage(b.fcv, b.fx, b.fy, b.fw, b.fh);
  const fy=(b.y+b.h-1)*TILE, dx=b.door*TILE;
  rr(dx-1,fy-1,TILE+2,TILE+1,2.5); fill(C.timberDk); ink(1.5);
  if(b.a<=0.5){ blob(dx+TILE/2, fy+TILE/2, 10, 12, 'rgba(74,222,128,.30)', false); }
  rr(dx+0.6,fy+0.6,TILE-3.2,TILE-1,2); fill(b.a>0.5 ? '#a8652f' : C.leaf);
  if(b.a<=0.5){ ctx.globalAlpha=.5; rr(dx+1.6,fy+1.6,4,TILE-3,1.5); fill(C.white); ctx.globalAlpha=1; }
  blob(dx+TILE-5.5, fy+TILE/2, 1.3,1.3, '#ffd23f');
  rr(dx+1,fy+TILE,TILE-2,3,1.2); fill('#c98d4f'); ink(1.2);
}

function drawRoof(b){
  if(b.a<=0.02) return;
  ctx.save(); ctx.globalAlpha=b.a;
  ctx.drawImage(b.rcv, b.rx, b.ry, b.rw, b.rh);
  /* solar-vent motes drift up instead of chimney smoke */
  const cxp=b.rx+b.rw-26+4.5, cyp=b.ry+14-8;
  ctx.globalAlpha=b.a*0.5;
  for(let i=0;i<2;i++){
    const p=((T/2.2)+i*39)%78;
    blob(cxp+Math.sin(p/13)*4, cyp-p*0.34, 1.4, 1.4, i?C.goldHi:C.leaf, false);
  }
  ctx.globalAlpha=b.a;
  if(b.a<0.55){ ctx.restore(); return; }
  const rw=b.rw, ry=b.ry+14, rh=b.rh-14;
  const sw=Math.min(rw-24, b.label.length*4.6+18);
  const sx=b.rx+(rw-sw)/2, sy=ry+rh-16;
  ctx.strokeStyle=C.ink; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.moveTo(sx+6,sy-4); ctx.lineTo(sx+6,sy);
  ctx.moveTo(sx+sw-6,sy-4); ctx.lineTo(sx+sw-6,sy); ctx.stroke();
  rr(sx,sy,sw,12,3); fill('#f6e0b0'); ink(1.6);
  ctx.font='bold 7px system-ui, -apple-system, sans-serif'; ctx.textAlign='center';
  ctx.fillStyle=C.ink; ctx.fillText(b.label, sx+sw/2, sy+8.4); ctx.textAlign='left';
  ctx.restore();
}

/* ---------------- tall grass ----------------
   Stroking ~300 clumps of bezier blades every frame was the single most
   expensive thing on screen, so the clumps are baked once into a small
   sprite sheet (one image per bend angle x height) and blitted instead.  */
const REED_GREEN = ['#55a83e','#5fbf4d','#6fd465','#4d9c3a'];
const RSS = 2;                    // supersample of the baked sprites
const RSW = 19, RSH = 25;         // sprite size in world units (kept tight: blend cost is area)
const ROX = RSW/2, ROY = RSH-3;   // where the base of the clump sits
const RBENDS = 15, RBMAX = 8.0, RHEIGHTS = 3;
const REED_SPR = [];

(function bakeReeds(){
  for(let hi=0; hi<RHEIGHTS; hi++){
    for(let bi=0; bi<RBENDS; bi++){
      const cv = document.createElement('canvas');
      cv.width = RSW*RSS; cv.height = RSH*RSS;
      const g = cv.getContext('2d');
      g.scale(RSS,RSS); g.translate(ROX, ROY);
      const bend = (bi/(RBENDS-1))*2*RBMAX - RBMAX;
      const base = 9 + hi*4.2;
      g.beginPath();
      for(let i=0;i<4;i++){
        const off  = (i-1.5)*2.4;
        const lean = bend*(0.75 + i*0.16);
        const h    = base*(0.78 + (i%2)*0.22);
        g.moveTo(off, 0);
        g.quadraticCurveTo(off + lean*0.25, -h*0.55, off + lean, -h);
      }
      g.lineCap='round'; g.lineJoin='round';
      g.strokeStyle=C.ink;    g.lineWidth=2.6; g.stroke();
      g.strokeStyle='#59ba49';g.lineWidth=1.4; g.stroke();
      REED_SPR.push(cv);
    }
  }
})();

function drawReed(r){
  const gust = 1 + Math.sin(T*0.011 + r.x*0.004)*0.55;
  const wind = Math.sin(T*0.045 + r.ph + r.x*0.045) * 2.4 * gust;
  /* the player pushes the blades aside as they wade through */
  const dx = r.x - P.x, dy = r.y - P.y;
  const d2 = dx*dx + dy*dy;
  let bend = wind;
  if(d2 < 240){ const d=Math.sqrt(d2); bend += (1 - d/15.5) * 8 * (dx<0 ? -1 : 1); }

  let bi = Math.round((bend + RBMAX)/(2*RBMAX)*(RBENDS-1));
  bi = bi<0 ? 0 : (bi>RBENDS-1 ? RBENDS-1 : bi);
  const spr = REED_SPR[r.hb*RBENDS + bi];
  const sc  = r.sc;
  /* nearest-neighbour + integer destination: the sprites are baked at ~1:1 for
     the usual zoom, so filtering here buys nothing and costs a lot */
  ctx.drawImage(spr, (r.x-ROX*sc)|0, (r.y-ROY*sc)|0, (RSW*sc)|0, (RSH*sc)|0);

  if(r.cat){
    const h = (9 + r.hb*4.2)*sc;
    ctx.save(); ctx.translate(r.x + bend*0.91*sc, r.y - h*0.98);
    ell(0,0,1.7,3.4); fill('#8a5a3b'); ink(1.2);
    ctx.restore();
  }
}

/* ---------------- critters ---------------- */
function drawCow(c){
  const x=c.x, y=c.y, f=c.face;
  const moving = (c.graze<=0 && (Math.abs(c.vx)+Math.abs(c.vy))>0.02);
  const bob = moving ? Math.sin(T/7)*0.7 : 0;
  const head = c.graze>0 ? 3.4 : 0;
  drop(x, y+7, 8.5, 3);
  ctx.save(); ctx.translate(x,y+bob);
  /* legs */
  const sw=moving?Math.sin(T/7)*1.4:0;
  [[-4.5,sw],[4.5,-sw]].forEach(([lx,o])=>{ rr(lx-1.4,3.4,2.8,5+o,1.2); fill(C.cowDk); ink(1.2); });
  /* body */
  blob(0,0,9,6.4,C.cow,1.6);
  ctx.save(); ell(0,0,9,6.4); ctx.clip();
  blob(-3.6,-1.6,3.2,2.4,C.spot,false); blob(3.4,1.8,2.6,2.0,C.spot,false);
  blob(1.2,-3.2,1.8,1.3,C.spot,false);
  ctx.restore();
  /* tail */
  ctx.strokeStyle=C.ink; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(-f*8.4,-1); ctx.quadraticCurveTo(-f*11,1+Math.sin(T/11)*1.2,-f*10,4); ctx.stroke();
  blob(-f*10,4.6,1.3,1.5,C.spot,false);
  /* head */
  ctx.save(); ctx.translate(f*8.6, -1+head);
  blob(0,0,4.4,4.0,C.cow,1.5);
  blob(f*1.6,1.6,2.6,2.0,C.snout,1.2);
  blob(f*0.8,1.4,0.5,0.5,C.ink,false); blob(f*2.4,1.4,0.5,0.5,C.ink,false);
  const blink = (T%210)<8;
  if(blink){ ctx.strokeStyle=C.ink; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(f*0.4,-1.4); ctx.lineTo(f*2,-1.4); ctx.stroke(); }
  else blob(f*1.2,-1.4,0.9,1.0,C.ink,false);
  blob(-f*2.6,-2.6,2.0,1.4,C.cowDk,1.1);
  rr(f*0.2,-4.8,1.6,1.8,0.7); fill('#e8dcc0'); ink(1);
  ctx.restore();
  ctx.restore();
}

function drawDuck(d,isMother){

function drawRabbit(r){

function drawGoat(g){

    ctx.globalAlpha=.6;
    const ht=T/6;

function drawDeer(d){
  const x=d.x, y=d.y, f=d.face;
  const moving=(d.graze<=0 && (Math.abs(d.vx)+Math.abs(d.vy))>0.02);

  for(let i=0;i<4;i++) blob(-4+i*2.5,-2+i%2,0.6,0.6,C.white,false);
  ctx.restore();
  ctx.save(); ctx.translate(f*8.5,-2+head);
  blob(0,0,3.8,3.4,'#c9954f',1.4);
  blob(f*1.4,1.2,2,1.6,'#b08a5a',1.1);

  ctx.moveTo(f*2,-3.5); ctx.lineTo(f*2.5,-7); ctx.lineTo(f*1,-9); ctx.moveTo(f*2.5,-7); ctx.lineTo(f*4,-9);
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle=C.ink; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-f*8.5,0); ctx.quadraticCurveTo(-f*11,2+Math.sin(T/15)*1,-f*10,5); ctx.stroke();
  if(d.mounted){
    ctx.save(); ctx.translate(0,-10);

  if(d.petting>0){

function drawCowHearts(c){

/* butterflies replace the fireflies now that it's daytime */
function drawButterflies(){
  for(const f of flies){
    const flap=Math.abs(Math.sin(f.p*7));
    const c=['#4ade80','#fde047','#7dd3fc','#f0abfc'][(f.x|0)%4];
    ctx.save(); ctx.translate(f.x,f.y);
    ctx.fillStyle=c;
    ell(-1.6,0,1.5,0.7+flap*1.7); ctx.fill();
    ell( 1.6,0,1.5,0.7+flap*1.7); ctx.fill();
    ctx.fillStyle=C.ink; ctx.fillRect(-0.4,-1.2,0.8,2.4);
    ctx.restore();
  }
}

/* Slow cloud shadows drifting over the fields.
   Each one is a clump of overlapping discs rather than an ellipse, so the
   outline is lumpy and torn the way a real cloud's shadow is. All the discs
   go into a single path and get one fill, so overlaps don't darken. */
const clouds = [];
(function seedClouds(){
  let seed = 20260909;
  const rnd = ()=>{ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; };
  for(let i=0;i<6;i++){
    const w = 78 + rnd()*66;              // half-width of the clump
    const h = w * (0.40 + rnd()*0.16);    // clouds are wider than they are tall
    const lobes = [];
    /* a few fat lobes through the middle */
    const core = 3 + (rnd()*3|0);
    for(let k=0;k<core;k++){
      lobes.push({
        dx: (rnd()-0.5)*w*1.15,
        dy: (rnd()-0.5)*h*0.75,
        r : h*(0.62 + rnd()*0.42),
        ph: rnd()*6.283
      });
    }
    /* a dense ring of small, jittered lobes chews the edge into something torn */
    const rim = 30 + (rnd()*14|0);
    for(let k=0;k<rim;k++){
      const a2 = (k/rim)*6.283 + (rnd()-0.5)*0.30;
      const push = 0.74 + rnd()*0.30;
      lobes.push({
        dx: Math.cos(a2)*w*push,
        dy: Math.sin(a2)*h*push,
        r : h*(0.10 + rnd()*rnd()*0.34),   // squared random: mostly small, a few bigger
        ph: rnd()*6.283
      });
    }
    /* a handful of wisps hanging off the edge */
    const wisps = 5 + (rnd()*5|0);
    for(let k=0;k<wisps;k++){
      const a2 = rnd()*6.283;
      const push = 1.02 + rnd()*0.22;
      lobes.push({
        dx: Math.cos(a2)*w*push,
        dy: Math.sin(a2)*h*push,
        r : h*(0.07 + rnd()*0.13),
        ph: rnd()*6.283
      });
    }
    clouds.push({
      x: rnd()*W, y: rnd()*H,
      s: 0.09 + rnd()*0.10,
      w, h, lobes
    });
  }
})();

function drawCloudShadows(vx,vy,vw,vh){
  for(const c of clouds){
    c.x += c.s;
    if(c.x - c.w*1.6 > W){ c.x = -c.w*1.6; c.y = Math.random()*H; }
  }
  ctx.save();
  /* punch the open houses out of the shadow layer: a roof blocks the sun */
  ctx.beginPath();
  ctx.rect(vx-8, vy-8, vw+16, vh+16);
  for(const b of BUILDINGS){
    if(b.a > 0.9) continue;
    ctx.rect(b.x*TILE, b.y*TILE, b.w*TILE, b.h*TILE);
  }
  ctx.clip('evenodd');

  ctx.fillStyle='rgba(58,64,30,.13)';
  for(const c of clouds){
    if(c.x + c.w*1.7 < vx || c.x - c.w*1.7 > vx+vw) continue;
    if(c.y + c.h*2.2 < vy || c.y - c.h*2.2 > vy+vh) continue;
    ctx.beginPath();
    for(let i=0;i<c.lobes.length;i++){
      const L = c.lobes[i];
      /* each lobe breathes a little, so the outline keeps shifting */
      const wob = Math.sin(T*0.008 + L.ph)*2.4;
      const lx = c.x + L.dx + wob;
      const ly = c.y + L.dy + Math.cos(T*0.005 + L.ph)*1.1;
      const lr = L.r + wob*0.35;
      ctx.moveTo(lx + lr, ly);
      ctx.arc(lx, ly, lr < 0.5 ? 0.5 : lr, 0, 6.2832);
    }
    ctx.fill();
  }
  ctx.restore();
}

/* Gliders ride the same sky as the cloud shadows: slow, high, non-interactive.
   White slender wings + aqua cockpit, frozen when reduced motion is asked. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const gliders = [
  {x:W*0.20, y:H*0.22, s:0.50, v:0.35, ph:0},
  {x:W*0.62, y:H*0.13, s:0.36, v:0.27, ph:2},
  {x:W*0.42, y:H*0.58, s:0.64, v:0.43, ph:4}
];
let gT = 0;
function drawGliders(){
  if(!RM){ for(const g of gliders){ g.x += g.v; if(g.x > W+60){ g.x = -60; g.y = Math.random()*H*0.7; } } gT++; }
  for(const g of gliders){
    const bob = Math.sin(gT*0.02 + g.ph)*3;
    ctx.save(); ctx.translate(g.x, g.y+bob); ctx.scale(g.s, g.s);
    ctx.globalAlpha = .92;
    ctx.fillStyle = '#f4f6f8';
    ctx.beginPath();
    ctx.moveTo(-22,0); ctx.lineTo(-4,-3.4); ctx.lineTo(4,-3.4); ctx.lineTo(22,0);
    ctx.lineTo(4,2.2); ctx.lineTo(-4,2.2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.1; ctx.stroke();
    rr(-1.6,-7,3.2,14,1.6); fill('#ffffff'); ink(1.1);
    blob(0,-4,1.1,1.1,C.aqua,false);
    ctx.restore();
  }
}

function paintHero(dir, step, blink, pose, t){
  pose = pose || 'walk'; t = t || 0;
  const front = dir===2 || pose!=='walk';

  /* ---- legs ---- */
  rr(-3.4, 3.6+step*1.2, 2.8, 5, 1.3); fill(C.jeans); ink(1.2);
  rr( 0.6, 3.6-step*1.2, 2.8, 5, 1.3); fill(C.jeans); ink(1.2);

  /* ---- torso: polo shirt ---- */
  rr(-4.6,-2.4,9.2,7.6,3); fill(C.shirt); ink(1.5);
  ctx.globalAlpha=.22; rr(-3.7,-1.6,2.6,5,1.3); fill(C.white); ctx.globalAlpha=1;
  if(dir===0){
    /* seen from behind: back of the collar and a seam */
    ctx.beginPath(); ctx.moveTo(-2.7,-3.3); ctx.lineTo(2.7,-3.3);
    ctx.lineTo(2.4,-1.7); ctx.lineTo(-2.4,-1.7); ctx.closePath();
    fill(C.collar); ink(1.1);
    ctx.strokeStyle='rgba(51,36,28,.35)'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(0,-1.5); ctx.lineTo(0,4.6); ctx.stroke();
  }
  if(front){
    /* collar */
    ctx.beginPath(); ctx.moveTo(-2.6,-2.6); ctx.lineTo(0,-0.2); ctx.lineTo(2.6,-2.6);
    ctx.lineTo(2.6,-3.4); ctx.lineTo(-2.6,-3.4); ctx.closePath();
    fill(C.collar); ink(1.1);
    ctx.strokeStyle=C.ink; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(0,-0.2); ctx.lineTo(0,2.2); ctx.stroke();
    rr(-1.4,2.6,2.8,1.2,0.6); fill(C.gold);
    blob(-0.9,0.8,0.34,0.34,C.ink,false); blob(-0.9,2.0,0.34,0.34,C.ink,false);
  }

  /* ---- arms + whatever he is holding ---- */
  const armL=(x,y,rot)=>{ ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot);
                          rr(-1.2,-0.6,2.4,4.8,1.2); fill(C.shirtDk); ink(1.2);
                          blob(0,4.6,1.5,1.5,C.skin,1.2); ctx.restore(); };
  switch(pose){
    case 'wave': {
      const w=Math.sin(t/4)*0.42;
      armL(-5.2,-1.6, 0.12);
      ctx.save(); ctx.translate(5.2,-1.8); ctx.rotate(-1.15+w);
      rr(-1.2,-0.6,2.4,4.8,1.2); fill(C.shirtDk); ink(1.2);
      blob(0,4.9,1.7,1.7,C.skin,1.2);
      ctx.restore(); break;
    }
    case 'controller': {
      const th=Math.sin(t/5)*0.5;
      armL(-4.6,-1.4, 0.55); armL(4.6,-1.4, -0.55);
      rr(-3.6,2.2,7.2,3.4,1.6); fill('#43584f'); ink(1.3);
      rr(-4.6,2.4,1.8,3,0.9); fill('#43584f'); ink(1.2);
      rr( 2.8,2.4,1.8,3,0.9); fill('#43584f'); ink(1.2);
      blob(-1.9,3.9+th*0.3,0.7,0.7,'#ffd23f',false);
      blob( 1.9,3.9-th*0.3,0.7,0.7,'#ff5f8d',false);
      break;
    }
    case 'laptop': {
      const th=Math.sin(t/3)*0.35;
      armL(-4.4,-1.2, 0.75+th*0.1); armL(4.4,-1.2, -0.75-th*0.1);
      rr(-4.4,3.4,8.8,1.6,0.8); fill('#8a93a5'); ink(1.2);
      ctx.save(); ctx.translate(0,3.4); ctx.rotate(-0.20);
      rr(-3.8,-4.6,7.6,4.8,1); fill('#43584f'); ink(1.3);
      rr(-3.1,-4.0,6.2,3.6,0.6); fill('#9fe6c4');
      ctx.restore(); break;
    }
    case 'vr': {
      armL(-5.2,-1.6, 0.2); armL(5.2,-1.6, -0.2); break;
    }
    case 'tablet': {
      const g=Math.sin(t/9)*0.12;
      armL(-4.6,-1.2, 0.62); armL(4.6,-1.2, -0.62);
      ctx.save(); ctx.translate(0,2.6); ctx.rotate(g);
      rr(-3.2,-2.6,6.4,5.2,1); fill('#43584f'); ink(1.3);
      rr(-2.6,-2.0,5.2,4.0,0.6); fill(C.lens);
      blob(0,-0.2,1.3,1.3,'#69c97a',false);
      ctx.restore(); break;
    }
    case 'marker': {
      const wr=Math.sin(t/6)*0.30;
      armL(-5.2,-1.6, 0.12);
      ctx.save(); ctx.translate(5.0,-1.8); ctx.rotate(-1.0+wr);
      rr(-1.2,-0.6,2.4,4.8,1.2); fill(C.shirtDk); ink(1.2);
      blob(0,4.9,1.6,1.6,C.skin,1.2);
      rr(-0.7,5.4,1.4,3.4,0.6); fill('#ff5f8d'); ink(1.1);
      ctx.restore(); break;
    }
    case 'trophy': {
      const lift=Math.sin(t/12)*0.5;
      armL(-5.2,-1.6, 0.12);
      ctx.save(); ctx.translate(5.0,-2.0-lift); ctx.rotate(-1.35);
      rr(-1.2,-0.6,2.4,4.8,1.2); fill(C.shirtDk); ink(1.2);
      ctx.restore();
      ctx.save(); ctx.translate(8.4,-5.0-lift);
      rr(-1.9,-2.4,3.8,3.4,1); fill('#f0c419'); ink(1.2);
      rr(-1.1,1.0,2.2,1.0,0.4); fill('#c9a227'); ink(1.1);
      rr(-2.0,2.0,4.0,1.2,0.5); fill('#c9a227'); ink(1.1);
      ctx.restore(); break;
    }
    case 'wrench': {
      const sw=Math.sin(t/7)*0.22;
      armL(-5.2,-1.6, 0.12);
      ctx.save(); ctx.translate(5.0,-1.6); ctx.rotate(-0.5+sw);
      rr(-1.2,-0.6,2.4,4.8,1.2); fill(C.shirtDk); ink(1.2);
      blob(0,4.9,1.6,1.6,C.skin,1.2);
      ctx.save(); ctx.translate(0,5.2); ctx.rotate(0.4);
      rr(-0.6,-4.6,1.2,5.2,0.5); fill('#aeb8c6'); ink(1.1);
      rr(-1.5,-6.0,3.0,2.0,0.7); fill('#aeb8c6'); ink(1.1);
      ctx.restore(); ctx.restore(); break;
    }
    case 'envelope': {
      const w=Math.sin(t/4)*0.40;
      ctx.save(); ctx.translate(-5.2,-1.8); ctx.rotate(1.15-w);
      rr(-1.2,-0.6,2.4,4.8,1.2); fill(C.shirtDk); ink(1.2);
      blob(0,4.9,1.7,1.7,C.skin,1.2);
      ctx.restore();
      armL(4.8,-1.4, -0.62);
      ctx.save(); ctx.translate(4.6,3.0); ctx.rotate(-0.12);
      rr(-2.8,-2.0,5.6,4.0,0.8); fill(C.collar); ink(1.2);
      ctx.strokeStyle=C.ink; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(-2.8,-2.0); ctx.lineTo(0,0.3); ctx.lineTo(2.8,-2.0); ctx.stroke();
      ctx.restore(); break;
    }
    case 'nothing':
      armL(-5.2,-1.6, 0.10); armL(5.2,-1.6, -0.10); break;
    default:
      rr(-6.4,-1.6-step*1.1,2.4,4.6,1.2); fill(C.shirtDk); ink(1.2);
      rr( 4.0,-1.6+step*1.1,2.4,4.6,1.2); fill(C.shirtDk); ink(1.2);
  }

  /* ---- head ---- */
  blob(0,-8.4,5.5,5.3,C.skin,1.5);
  /* jaw shading */
  ctx.globalAlpha=.20; blob(0,-6.4,3.6,1.9,C.skinDk,false); ctx.globalAlpha=1;
  /* hair: swept up, with volume above the crown */
  ctx.save();
  blob(-0.3,-12.1,6.1,3.9,C.hair,1.4);
  blob(-2.3,-13.6,3.4,2.6,C.hair,1.4);
  blob( 1.9,-13.2,3.0,2.3,C.hair,1.4);
  ctx.save(); ell(0,-8.4,5.5,5.3); ctx.clip();
  ell(-0.3,-11.4,5.9,3.6); fill(C.hair);
  ell(-3.4,-9.6,2.3,2.6); fill(C.hair);
  ell( 3.4,-9.8,2.1,2.4); fill(C.hair);
  ctx.restore();
  ctx.globalAlpha=.30; blob(-2.4,-13.4,1.5,0.9,C.hairHi,false); ctx.globalAlpha=1;
  ctx.restore();
  if(dir===0){
    /* facing away: ears, nape and a highlight so he still reads as a head */
    blob(-5.3,-7.9,1.15,1.5,C.skin,1.2);
    blob( 5.3,-7.9,1.15,1.5,C.skin,1.2);
    ell(0,-8.6,5.4,5.1); fill(C.hair); ink(1.4);
    ctx.globalAlpha=.32;
    blob(-1.9,-11.0,2.5,1.5,C.hairHi,false);
    blob( 2.2,-10.4,1.5,1.0,C.hairHi,false);
    ctx.globalAlpha=1;
    /* nape */
    ctx.strokeStyle='rgba(51,36,28,.55)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-2.2,-5.2); ctx.quadraticCurveTo(0,-4.2,2.2,-5.2); ctx.stroke();
    blob(0,-4.4,1.9,1.0,C.skin,1.1);
  } else {
    /* sideburns */
    ctx.globalAlpha=.55; blob(-4.6,-8.0,0.8,1.6,C.hair,false); blob(4.6,-8.0,0.8,1.6,C.hair,false); ctx.globalAlpha=1;
  }

  if(pose==='vr'){
    /* headset instead of a face */
    rr(-5.4,-10.2,10.8,4.6,1.8); fill('#5b6ad0'); ink(1.5);
    rr(-4.2,-9.4,8.4,3.0,1.2); fill(C.lens);
    ctx.globalAlpha=.55; rr(-3.6,-9.1,2.6,2.4,0.8); fill(C.white); ctx.globalAlpha=1;
    rr(-5.9,-9.4,1.0,2.6,0.5); fill('#48579e'); ink(1.1);
    rr( 4.9,-9.4,1.0,2.6,0.5); fill('#48579e'); ink(1.1);
    ctx.strokeStyle=C.ink; ctx.lineWidth=0.85; ctx.lineCap='round'; ctx.beginPath();
    ctx.arc(0,-6.4,1.15,0.28*Math.PI,0.72*Math.PI); ctx.stroke();
    return;
  }

  if(dir!==0){
    const ex = dir===1?1.3:(dir===3?-1.3:0);
    /* round wire glasses */
    const gx=2.15, gy=-8.3, gr=2.05;
    ctx.beginPath(); ctx.arc(-gx+ex,gy,gr,0,6.283); fill(C.lens);
    ctx.beginPath(); ctx.arc( gx+ex,gy,gr,0,6.283); fill(C.lens);
    ctx.globalAlpha=.65;
    ctx.beginPath(); ctx.arc(-gx+ex-0.6,gy-0.6,0.75,0,6.283); fill(C.white);
    ctx.beginPath(); ctx.arc( gx+ex-0.6,gy-0.6,0.75,0,6.283); fill(C.white);
    ctx.globalAlpha=1;
    /* eyes behind the lenses */
    if(blink){
      ctx.strokeStyle=C.ink; ctx.lineWidth=0.9; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(-gx+ex-0.8,gy); ctx.lineTo(-gx+ex+0.8,gy);
      ctx.moveTo( gx+ex-0.8,gy); ctx.lineTo( gx+ex+0.8,gy); ctx.stroke();
    } else {
      blob(-gx+ex,gy,0.72,0.82,C.ink,false);
      blob( gx+ex,gy,0.72,0.82,C.ink,false);
    }
    ctx.strokeStyle=C.frame; ctx.lineWidth=0.75; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(-gx+ex,gy,gr,0,6.283); ctx.stroke();
    ctx.beginPath(); ctx.arc( gx+ex,gy,gr,0,6.283); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-gx+ex+gr,gy-0.2); ctx.lineTo(gx+ex-gr,gy-0.2);
    ctx.moveTo(-gx+ex-gr,gy-0.3); ctx.lineTo(-5.2+ex,gy-0.8);
    ctx.moveTo( gx+ex+gr,gy-0.3); ctx.lineTo( 5.2+ex,gy-0.8);
    ctx.stroke();
    /* the slight, closed-mouth smile from the photo */
    ctx.strokeStyle=C.ink; ctx.lineWidth=0.85; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(ex,-6.5,1.15,0.28*Math.PI,0.72*Math.PI); ctx.stroke();
  }
}

function drawPlayer(){
  const step=P.moving?Math.sin(P.anim*1.6):0;
  const squash=P.moving?1+Math.abs(step)*0.05:1;
  drop(P.x, P.y+9, 6.5, 2.6);
  ctx.save(); ctx.translate(P.x,P.y); ctx.scale(1/squash, squash);
  paintHero(P.dir, step, (T%230)<9, 'walk');
  ctx.restore();
}

let confettiUntil = 0;
const CONF = [];
function drawConfetti(){
  if(T > confettiUntil){ if(CONF.length) CONF.length = 0; return; }
  if(CONF.length < 90){
    for(let i=0;i<4;i++) CONF.push({
      x: camX + Math.random()*(innerWidth/ZOOM),
      y: camY - 10 - Math.random()*40,
      vy: 0.6 + Math.random()*1.1,
      vx: (Math.random()-0.5)*0.5,
      r: Math.random()*6.283,
      vr: (Math.random()-0.5)*0.3,
      c: ['#ff5f8d','#ffd23f','#4cc9f0','#7ee787','#c77dff','#ff8c42'][(Math.random()*6)|0]
    });
  }
  for(const p of CONF){
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-1.6, -1, 3.2, 2.2);
    ctx.restore();
  }
}

function drawBubble(){
  if(!bubble) return;
  ctx.font = 'bold 6px system-ui, -apple-system, "Segoe UI", sans-serif';
  if(!bubble.lines){                       // wrap once, then reuse
    const words = bubble.text.split(' ');
    const max = 104, out = [];
    let cur = '';
    for(const w of words){
      const t = cur ? cur+' '+w : w;
      if(ctx.measureText(t).width > max && cur){ out.push(cur); cur = w; }
      else cur = t;
    }
    if(cur) out.push(cur);
    bubble.lines = out;
    bubble.w = Math.max(...out.map(l=>ctx.measureText(l).width)) + 12;
    bubble.h = out.length*8 + 9;
  }
  /* pop in over ~9 frames, hold, then fade over the last ~14 */
  const appear = Math.min(1, (T - bubble.born) / 9);
  const leave  = Math.min(1, (bubble.until - T) / 14);
  const k = Math.max(0, Math.min(appear, leave));
  if(k <= 0.02) return;

  const bw = bubble.w, bh = bubble.h;
  const bx = P.x - bw/2, by = P.y - 26 - bh;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(P.x, P.y - 26);
  ctx.scale(0.6 + k*0.4, 0.6 + k*0.4);
  ctx.translate(-P.x, -(P.y - 26));
  rr(bx, by, bw, bh, 4); fill(C.cream); ink(1.5);
  /* tail */
  ctx.beginPath();
  ctx.moveTo(P.x - 3.5, by + bh - 0.6);
  ctx.lineTo(P.x, by + bh + 5.5);
  ctx.lineTo(P.x + 3.5, by + bh - 0.6);
  ctx.closePath(); fill(C.cream);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(P.x - 3.5, by + bh - 0.6);
  ctx.lineTo(P.x, by + bh + 5.5);
  ctx.lineTo(P.x + 3.5, by + bh - 0.6);
  ctx.stroke();
  ctx.fillStyle = C.ink;
  ctx.textAlign = 'center';
  bubble.lines.forEach((l,i)=> ctx.fillText(l, P.x, by + 10 + i*8));
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawFlyingCow(){

  blob(8.4,-1.6,4.2,3.8,C.cow,1.5);

function drawMinimap(){
  mmx.clearRect(0,0,mm.width,mm.height);
  const sx=mm.width/W, sy=mm.height/H;
  mmx.fillStyle='#6fc24e'; mmx.fillRect(0,0,mm.width,mm.height);
  mmx.fillStyle='#e0bd76'; mmx.fillRect(240*TILE*sx,140*TILE*sy,45*TILE*sx,35*TILE*sy);

function render(){
  T++;
  renderWater();
  ctx.fillStyle='#8fe06a'; ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.scale(ZOOM,ZOOM);
  const cx=camX, cy=camY;
  ctx.translate(-cx,-cy);

  const vw=innerWidth/ZOOM, vh=innerHeight/ZOOM;
  const x0=Math.max(0,Math.floor(cx/TILE)-1), y0=Math.max(0,Math.floor(cy/TILE)-1);
  const x1=Math.min(MAP_W,Math.ceil((cx+vw)/TILE)+1), y1=Math.min(MAP_H,Math.ceil((cy+vh)/TILE)+1);

  const bx=x0*TILE, by=y0*TILE, bw=(x1-x0)*TILE, bh=(y1-y0)*TILE;
  ctx.drawImage(groundCv, bx,by,bw,bh, bx,by,bw,bh);
  ctx.drawImage(wcv, 0,0,WPW,WPH, WX0*TILE, WY0*TILE, WPW*WSC, WPH*WSC);
  BUILDINGS.forEach(drawFacade);

  const d=[];
  for(const t of TREES){
    if(t.x<bx-24||t.x>bx+bw+24||t.y<by-30||t.y>by+bh+24) continue;
    d.push({z:t.y+15, f:()=>drawTree(t)});
  }
  for(const o of objs){
    if(o.home && o.home.a>0.85) continue;
    d.push({z:o.y+o.ph, f:()=>drawObj(o)});
  }
  for(const f of MOUNTAIN_FEATURES) d.push({z:f.y+f.ph, f:()=>drawMountainFeature(f)});
  for(const p of PROPS) d.push({z:p.y+16, f:()=>drawProp(p)});
  for(const r of REEDS){
    if(r.x<cx-20||r.x>cx+vw+20||r.y<cy-40||r.y>cy+vh+20) continue;   // cull offscreen
    d.push({z:r.y, f:()=>drawReed(r)});
  }
  for(const c of cows)  d.push({z:c.y+7,  f:()=>{ drawCow(c); drawCowHearts(c); }});
  for(const r of rabbits) d.push({z:r.y+5, f:()=>drawRabbit(r)});
  for(const g of goats)  d.push({z:g.y+6, f:()=>drawGoat(g)});
  for(const dr of deer)  d.push({z:dr.y+9, f:()=>drawDeer(dr)});
  d.push({z:mother.y+4, f:()=>{ ducklings.forEach(k=>drawDuck(k,false)); drawDuck(mother,true); }});
  for(const b of BUILDINGS) d.push({z:(b.y+b.h-1)*TILE, f:()=>drawRoof(b)});
  d.push({z:P.y+6, f:drawPlayer});
  d.push({z:1e9, f:()=>{ drawConfetti(); drawBubble(); }});   // always on top of the world
  d.sort((a,b)=>a.z-b.z).forEach(k=>k.f());

  /* bouncing arrows over doors you haven't opened */
  for(const b of BUILDINGS){
    if(b._entered) continue;
    const dx=b.door*TILE+TILE/2, fy=(b.y+b.h-1)*TILE;
    const bob=Math.sin(T/14+b.x)*2.2;
    ctx.save(); ctx.translate(dx, fy-20+bob);
    ctx.beginPath();
    ctx.moveTo(-4.5,-4); ctx.lineTo(4.5,-4); ctx.lineTo(0,4); ctx.closePath();
    fill('#ffd23f'); ink(1.5);
    ctx.restore();
  }

  drawButterflies();
  drawCloudShadows(cx, cy, vw, vh);
  drawGliders();
  ctx.restore();
  drawFlyingCow();
  drawLandmarkSeq();
  drawMinimap();
}

  avT++;

  ctx.clearRect(0,0,200,200);
  ctx.save();
  ctx.translate(100, 140);
  ctx.scale(5.3, 5.3);

  const bob   = Math.sin(avT/26)*0.5;
  const sway  = Math.sin(avT/38)*0.05;
  const blink = (avT%190)<9;

  let pose = avatarPose;
  if(pose==='idle') pose = (avT%420) > 380 ? 'wave' : 'wave2';

/* ================= REAL 3D WORLD =================
   Heightfield terrain + merged-geometry buildings, trees, props, critters,
   a jointed player humanoid with a jetpack, and a follow camera.
   The sim (movement intent, collision intent, interactions, saves, audio)
   stays 2D-grid based; this block only adds altitude + 3D presentation. */
const WALL_H = 30, ROOF_H = 30, TREE_H = 27, FLY_CEIL = 750;
const R3X = x => x - W/2, R3Z = y => y - H/2;
function tileBaseH(t, tx, ty){
  switch(t){
    case ROCK: return 26;
    case WATER: return -5;
    case DESERT: return 3 + hash(tx*7+3, ty*7+9)*2;
    case SAND: return 1;
    case FLOOR: case WALL: return 1;
    case RAIL: case RUNWAY: return 0.5;
    default: return (hash(tx*3+1, ty*3+2)-0.5)*3;
  }
}
const HGRID = [];
for(let jy=0; jy<=MAP_H; jy++){ HGRID[jy]=[];
  for(let ix=0; ix<=MAP_W; ix++){
    let sum=0, n=0, flat=true;
    for(let ay=jy-1; ay<=jy; ay++) for(let ax=ix-1; ax<=ix; ax++){
      const t=(map[ay]&&map[ay][ax]!==undefined)?map[ay][ax]:GRASS;
      sum+=tileBaseH(t, Math.max(0,Math.min(MAP_W-1,ax)), Math.max(0,Math.min(MAP_H-1,ay))); n++;
      if(t!==FLOOR&&t!==WALL) flat=false;
    }
    HGRID[jy][ix]= flat ? 1 : sum/n;
  }
}
function terrainH(px, py){
  let fx=px/TILE, fy=py/TILE;
  fx=Math.max(0,Math.min(MAP_W-0.001,fx)); fy=Math.max(0,Math.min(MAP_H-0.001,fy));
  const x0=Math.floor(fx), y0=Math.floor(fy), ax=fx-x0, ay=fy-y0;
  const a=HGRID[y0][x0], b=HGRID[y0][x0+1], c=HGRID[y0+1][x0], d=HGRID[y0+1][x0+1];
  return a+(b-a)*ax+(c-a)*ay+(a-b-c+d)*ax*ay;
}
function cornerMax(tx,ty){
  let m=-1e9;
  for(let jy=ty;jy<=ty+1;jy++) for(let ix=tx;ix<=tx+1;ix++)
    m=Math.max(m, HGRID[Math.max(0,Math.min(MAP_H,jy))][Math.max(0,Math.min(MAP_W,ix))]);
  return m;
}
function roofAt(tx,ty){
  for(const b of BUILDINGS)
    if(tx>=b.x&&tx<b.x+b.w&&ty>=b.y&&ty<b.y+b.h) return b.roofH||ROOF_H;
  return -1e9;
}
/* top of the tower covering a tile (HR high-rises); falls back to WALL_H pre-init */
function wallTopAt(tx,ty){
  for(const b of BUILDINGS)
    if(tx>=b.x&&tx<b.x+b.w&&ty>=b.y&&ty<b.y+b.h) return b.roofH||WALL_H;
  return WALL_H;
}
function groundHeightAt(px,py,alt){
  const g=terrainH(px,py);
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  let top=-1e9;
  if(tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H) top=roofAt(tx,ty);
  if(top>0&&(alt||0)>=top-2) return top;
  return g;
}
function passable3(tx,ty,alt){
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return false;
  const t=map[ty][tx], key=tx+','+ty;
  if(t===WATER) return alt>=2;
  if(t===WALL) return alt>=wallTopAt(tx,ty);
  if(t===TREE) return alt>=TREE_H;
  if(t===ROCK) return alt>=cornerMax(tx,ty)-2;
  if((objSolid.has(key)||propSolid.has(key)) && alt<16) return false;
  return true;
}
function movePlayer3d(dx,dy){
  if(P.alt===undefined){ P.alt=0; P.vy=0; }
  if(Math.abs(dx)>Math.abs(dy)) P.dir = dx>0?1:3; else P.dir = dy>0?2:0;
  const air=P.alt>0.5, sp=P.speed*2*(air?1.55:1), r=5;
  const ok=(nx,ny)=>{
    for(const [qx,qy] of [[nx-r,ny-r],[nx+r,ny-r],[nx-r,ny+r],[nx+r,ny+r]])
      if(!passable3(Math.floor(qx/TILE),Math.floor(qy/TILE),P.alt)) return false;
    return true;
  };
  const nx=P.x+dx*sp, ny=P.y+dy*sp;
  if(ok(nx,P.y) && groundHeightAt(nx,P.y,P.alt)<=P.alt+7) P.x=nx;
  if(ok(P.x,ny) && groundHeightAt(P.x,ny,P.alt)<=P.alt+7) P.y=ny;
  P.anim+=0.2;
}
/* merge static boxes into one mesh: few draw calls, keeps the pixel look */
function GeoBatch(){ this.pos=[]; this.nor=[]; this.col=[]; this.idx=[]; this.n=0; }
GeoBatch.prototype.put=function(geo,x,y,z,c,ry){
  if(ry) geo.rotateY(ry);
  geo.translate(x,y,z);
  const p=geo.getAttribute('position'), n=geo.getAttribute('normal'), col=new THREE.Color(c);
  for(let i=0;i<p.count;i++){ this.pos.push(p.getX(i),p.getY(i),p.getZ(i)); this.nor.push(n.getX(i),n.getY(i),n.getZ(i)); this.col.push(col.r,col.g,col.b); }
  const ix=geo.getIndex();
  if(ix){ for(let i=0;i<ix.count;i++) this.idx.push(ix.getX(i)+this.n); }
  else { for(let i=0;i<p.count;i++) this.idx.push(i+this.n); }
  this.n+=p.count;
  geo.dispose();
};
GeoBatch.prototype.box=function(w,h,d,x,y,z,c,ry){ this.put(new THREE.BoxGeometry(w,h,d),x,y,z,c,ry); };
GeoBatch.prototype.mesh=function(mat){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(this.col,3));
  g.setIndex(this.idx);
  const m=new THREE.Mesh(g, mat||GeoBatch.lamb());
  m.castShadow=true; m.receiveShadow=true;
  return m;
};
GeoBatch.lamb=function(){
  if(!GeoBatch._l) GeoBatch._l=new THREE.MeshLambertMaterial({vertexColors:true});
  return GeoBatch._l;
};
/* Merge a shared Kenney geometry into a batch WITHOUT flattening its baked vertex
   colors (GeoBatch.put tints everything one color). Clones so the cached geometry
   stays reusable across placements. Additive helper; GeoBatch untouched. 3D-houses. */
function batPutGeo(bat, geo, x,y,z, ry, sc){
  if(!geo) return;
  const g=geo.clone();
  if(sc&&sc!==1){ const p=g.getAttribute('position'); for(let i=0;i<p.count;i++){ p.setX(i,p.getX(i)*sc); p.setY(i,p.getY(i)*sc); p.setZ(i,p.getZ(i)*sc); } }
  if(ry) g.rotateY(ry);
  g.translate(x,y,z);
  const p=g.getAttribute('position'), n=g.getAttribute('normal'), c=g.getAttribute('color');
  for(let i=0;i<p.count;i++){ bat.pos.push(p.getX(i),p.getY(i),p.getZ(i));
    bat.nor.push(n.getX(i),n.getY(i),n.getZ(i)); bat.col.push(c.getX(i),c.getY(i),c.getZ(i)); }
  const ix=g.getIndex();
  if(ix){ for(let i=0;i<ix.count;i++) bat.idx.push(ix.getX(i)+bat.n); }
  else { for(let i=0;i<p.count;i++) bat.idx.push(i+bat.n); }
  bat.n+=p.count;
  g.dispose();
}

  const j=(hash(tx*13+5,ty*13+11)-0.5)*0.16;

function parseKenneyOBJ(objText, mtlText, targetH){
  const pal={}; let cur=null;
  for(const ln of mtlText.split('\n')){
    const p=ln.trim().split(/\s+/);
    if(p[0]==='newmtl') cur=p[1];
    else if(p[0]==='Kd'&&cur) pal[cur]=[+p[1],+p[2],+p[3]];
  }
  const V=[], N=[], pos=[], nor=[], col=[], idx=[], seen=new Map();
  let rgb=[1,1,1];
  const vk=key=>{
    let id=seen.get(key);
    if(id===undefined){
      const q=key.split('/'), vi=+q[0]-1;
      if(vi<0||vi>=V.length||isNaN(vi)) return 0;
      const v=V[vi]; if(!v||v.length<3) return 0;
      const nvi=q[2]?+q[2]-1:-1;
      const n=nvi>=0&&nvi<N.length?N[nvi]:null;
      if(isNaN(v[0])||isNaN(v[1])||isNaN(v[2])) return 0;
      id=pos.length/3;
      pos.push(v[0],v[1],v[2]); nor.push(n?n[0]:0,n?n[1]:1,n?n[2]:0); col.push(rgb[0],rgb[1],rgb[2]);
      seen.set(key,id);
    }
    return id;
  };
  for(const ln of objText.split('\n')){
    const p=ln.trim().split(/\s+/);
    if(p[0]==='v') V.push([+p[1],+p[2],+p[3]]);
    else if(p[0]==='vn') N.push([+p[1],+p[2],+p[3]]);
    else if(p[0]==='usemtl') rgb=pal[p[1]]||[1,1,1];
    else if(p[0]==='f'){ const vs=p.slice(1);
      for(let k=1;k<vs.length-1;k++) idx.push(vk(vs[0]),vk(vs[k]),vk(vs[k+1])); }
  }
  let mn=1e9, mx=-1e9;
  for(let i=1;i<pos.length;i+=3){ if(pos[i]<mn)mn=pos[i]; if(pos[i]>mx)mx=pos[i]; }
  if(pos.length<9||idx.length<3) return null;
  const range=mx-mn;
  const s=range>0.001?targetH/range:1;
  for(let i=0;i<pos.length;i++) pos[i]*=s;
  /* validate no NaN in positions */
  for(let i=0;i<pos.length;i++){ if(isNaN(pos[i])) return null; }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  return g;
}
function loadFlora(){
  const load=([key,file,h],base)=>Promise.all([

    fetch(base+file+'.mtl').then(r=>{ if(!r.ok) throw 0; return r.text(); })
  ]).then(([o,m])=>[key, parseKenneyOBJ(o,m,h)]).catch(e=>{console.warn('loadFlora fail:',key,e);return null;});

/* CraftPix critter sprites as upright Y-billboards (paper figures standing on
   the terrain, pivot at the feet, face normal +Z). One square plane per
   species; world size matched to the 3D cast (player ~22 tall, walls 30):
   cow 22, deer 19, goat 17, rooster 13, hare 11, chick 8.5.
   Sheet layout: 6x8 sheets (bull/sheep/rooster/chick) rows 0-3 walk
   front/back/sideL/sideR, rows 4-7 idle front/back/sideL/sideR col 0;
   split sheets (deer/hare) walk file rows 0-3, idle file rows 0-3 col 0. */
function loadSprites(){
  const loadImg=file=>new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=file; });
  /* Cut one cell + measure transparent padding below the visible pixels
     (alphaTest 0.4 discards alpha<~102, so the hooves sit pad*h above the
     plane base). Grounding subtracts pad*h so visible feet touch terrain. */
  const cut=(img,cw,ch,c,r)=>{
    const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    const g=cv.getContext('2d');
    g.drawImage(img,c*cw,r*ch,cw,ch,0,0,cw,ch);
    let pad=0;
    try{
      const d=g.getImageData(0,0,cw,ch).data;
      let low=-1;
      for(let y=ch-1;y>=0&&low<0;y--)
        for(let x=0;x<cw;x++){ if(d[(y*cw+x)*4+3]>=102){ low=y; break; } }
      pad=low<0?1:(ch-1-low)/ch;
    }catch(e){ pad=0; }
    const t=new THREE.CanvasTexture(cv);
    t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
    t.generateMipmaps=false; t.encoding=THREE.sRGBEncoding;
    return {t,pad};
  };
  const SPEC={
    cow:{w:22,h:22,cw:64,ch:64,n:6,walk:'assets/craftpix/bull.png',idle:'assets/craftpix/bull.png'},
    goat:{w:17,h:17,cw:32,ch:32,n:6,walk:'assets/craftpix/sheep.png',idle:'assets/craftpix/sheep.png'},
    mother:{w:13,h:13,cw:32,ch:32,n:6,walk:'assets/craftpix/rooster.png',idle:'assets/craftpix/rooster.png'},
    duckling:{w:8.5,h:8.5,cw:16,ch:16,n:6,walk:'assets/craftpix/chick.png',idle:'assets/craftpix/chick.png'},
    deer:{w:19,h:19,cw:32,ch:32,n:6,walk:'assets/craftpix/deer-walk.png',idle:'assets/craftpix/deer-idle.png'},
    rabbit:{w:11,h:11,cw:32,ch:32,n:5,walk:'assets/craftpix/hare-walk.png',idle:'assets/craftpix/hare-idle.png'}
  };
  const files=[...new Set(Object.values(SPEC).flatMap(s=>[s.walk,s.idle]))];
  return Promise.all(files.map(f=>loadImg(f).then(im=>[f,im]))).then(ps=>{
    const IM=Object.fromEntries(ps);
    const out={};
    for(const [k,s] of Object.entries(SPEC)){
      const wi=IM[s.walk], ii=IM[s.idle];
      const sameFile=s.walk===s.idle;
      const walkRow=r=>{ const a=[]; for(let i=0;i<s.n;i++) a.push(cut(wi,s.cw,s.ch,i,r)); return a; };
      const idleCell=(img,r)=>cut(img,s.cw,s.ch,0,r);
      const dirs={
        front:{walk:walkRow(0), idle:idleCell(ii,sameFile?4:0)},
        back:{walk:walkRow(1), idle:idleCell(ii,sameFile?5:1)},
        left:{walk:walkRow(2), idle:idleCell(ii,sameFile?6:2)},
        right:{walk:walkRow(3), idle:idleCell(ii,sameFile?7:3)}
      };
      out[k]={dirs,w:s.w,h:s.h};
    }
    return out;
  });
}

      bat.box(16,WALL_H-1,16, R3X(tx*TILE+8), 1+(WALL_H-1)/2, R3Z(ty*TILE+8), '#FBF4E4');

    const X0=R3X(b.x*TILE), X1=R3X((b.x+b.w)*TILE), Z0=R3Z(b.y*TILE), Z1=R3Z((b.y+b.h)*TILE);

    bat.box(2,2.5,b.h*TILE+4, b.roof, X1+1, 28.5, cz);
    const doorX=R3X(b.door*TILE+8);
    const winGeo=b.w>=20?F.winM:F.winN; /* corner-window variant per building size (R2) */

    const nSlab=RH>=500?8:RH>=350?7:RH>=250?6:5;

      bat.box(1.2,gh,id+1,cx-iw/2-0.3,yMid,cz,aqua);

    cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  }
  size3d();
  addEventListener('resize', ()=>{ if(R3on) size3d(); });
  R3={renderer,scene,cam,sun,rimLight,ambient,blds,critters,player,treeData,treeMeshes,dummy,gl3,wtex,motes,cloud3d,bird3,size3d,
      camS:{x:P.x, y:terrainH(P.x,P.y), z:P.y}};
return true;
}
function render3d(){
  const R=R3;
  R.wtex.needsUpdate=true;
  for(const e of R.blds){
    e.mesh.material.opacity=e.b.a;
    e.label.material.opacity=e.b.a;
    e.label.quaternion.copy(R.cam.quaternion);
    e.door.material.color.set(e.b.a<=0.5?'#4ADE80':'#c98d4f');
  }
  /* high-rise occlusion fade (HR): raycast camera->player, interposing towers 0.25 */
  if(!R.occ) R.occ={ray:new THREE.Raycaster(), dir:new THREE.Vector3(), tgt:new THREE.Vector3()};
  R.occ.tgt.set(R3X(P.x), (P.alt||0)+10, R3Z(P.y));
  R.occ.dir.copy(R.occ.tgt).sub(R.cam.position);
  const occD=R.occ.dir.length()||1;
  R.occ.ray.set(R.cam.position, R.occ.dir.multiplyScalar(1/occD));
  R.occ.ray.far=occD-8;
  for(const e of R.blds){
    if(e.mesh.material.opacity>0.26&&R.occ.ray.intersectObject(e.mesh,false).length){
      e.mesh.material.opacity=0.25; e.label.material.opacity=0.25;
    }
  }
  /* player humanoid */
  if(P.alt===undefined){ P.alt=0; P.vy=0; }
  const pl=R.player, s=Math.sin(P.anim*1.6), flying=(P.alt||0)>2;
  const gy=groundHeightAt(P.x,P.y,P.alt);
  pl.group.position.set(R3X(P.x), P.alt, R3Z(P.y));
  pl.group.rotation.y=[Math.PI,Math.PI/2,0,-Math.PI/2][P.dir]||0;
  const sw=P.moving&&!flying?s:0;
  pl.legL.rotation.x=sw*0.55; pl.legR.rotation.x=-sw*0.55;
  pl.armL.rotation.x=-sw*0.4; pl.armR.rotation.x=sw*0.4;
  pl.armL.rotation.z=0.08; pl.armR.rotation.z=-0.08;
  if(flying){
    pl.legL.rotation.x=pl.legR.rotation.x=-0.8;
    pl.armL.rotation.z=0.9; pl.armR.rotation.z=-0.9;
  }
  if(!flying) pl.group.position.y+=Math.abs(sw)*0.8;
  pl.flame.visible=!!P._thrust;
  if(P._thrust) pl.flame.scale.set(1,0.8+Math.random()*0.5,1);
  /* critters: cylindrical Y-billboards — face the camera around Y (stay
     upright), pick front/back/side art by movement relative to the camera */
  let ci=0;
  const putSprite=(x,y,vx,vy,duck,hop)=>{
    const e=R.critters[ci++]; if(!e) return;
    const m=e.mesh;
    const sp=Math.hypot(vx||0,vy||0);
    const moving=!RM&&(duck?true:sp>0.02);
    if(sp>0.02) e.heading=Math.atan2(vx,vy);
    /* cylindrical billboard: yaw the plane normal (+Z) at the camera */
    const camYaw=Math.atan2(R.cam.position.x-m.position.x, R.cam.position.z-m.position.z);
    m.rotation.y=camYaw;
    let rel=e.heading-camYaw;
    while(rel>Math.PI) rel-=Math.PI*2;
    while(rel<-Math.PI) rel+=Math.PI*2;
    const dir=(rel>=-Math.PI/4&&rel<Math.PI/4)?'front'
      :(rel>=Math.PI/4&&rel<3*Math.PI/4)?'right'
      :(rel>=-3*Math.PI/4&&rel<-Math.PI/4)?'left':'back';
    const set=e.dirs[dir];
    const fr=(moving&&set.walk.length)?set.walk[Math.floor(T/8+e.phase)%set.walk.length]:set.idle;
    if(m.material.map!==fr.t){ m.material.map=fr.t; m.customDepthMaterial.map=fr.t; }
    const lift=(hop>0)?2.5*Math.abs(Math.sin(T*0.3)):0;
    /* upright cutouts pivot at the feet: subtract the cell's transparent
       bottom padding so visible hooves (not the plane edge) sit on the
       ground; -0.3 plants them firmly. Ducks swim: waterline at -0.2. */
    const ground=duck?-0.2:terrainH(x,y);
    m.position.set(R3X(x),ground-fr.pad*e.h-0.3+lift,R3Z(y));
  };
  for(const c of cows) putSprite(c.x,c.y,c.vx,c.vy);
  for(const r of rabbits) putSprite(r.x,r.y,r.vx,r.vy,false,r.hop);
  for(const g of goats) putSprite(g.x,g.y,g.vx,g.vy);
  for(const d of deer) putSprite(d.x,d.y,d.vx,d.vy);
  putSprite(mother.x,mother.y,Math.cos(mother.a),Math.sin(mother.a),true);
  for(const k of ducklings) putSprite(k.x,k.y,Math.cos(mother.a),Math.sin(mother.a),true);
  /* tree sway */
  for(const td of R.treeData){
    R.dummy.position.set(td.x, td.gy, td.z);
    R.dummy.rotation.set(0,0,Math.sin(T*0.02+td.ph)*0.05);
    R.dummy.scale.setScalar(td.s);
    R.dummy.updateMatrix();
    td.im.setMatrixAt(td.idx, R.dummy.matrix);
  }
  for(const tm of R.treeMeshes) tm.im.instanceMatrix.needsUpdate=true;
  /* gliders ride high */
  if(!RM){ for(const gg of gliders){ gg.x+=gg.v; if(gg.x>W+60){ gg.x=-60; gg.y=Math.random()*H*0.7; } } }
  R.gl3.forEach((grp,i)=>{ grp.position.set(R3X(gliders[i].x), 215+i*16, R3Z(gliders[i].y));
    grp.rotation.z=Math.sin(T*0.003+gliders[i].ph)*0.08; });
  /* follow camera + travelling sun */
  const fy=Math.max(gy, P.alt||0);
  R.camS.x+=(P.x-R.camS.x)*0.12; R.camS.z+=(P.y-R.camS.z)*0.12; R.camS.y+=(fy-R.camS.y)*0.12;
  const pitch=camAngleDeg*Math.PI/180, D=camDist;
  const camY=R.camS.y+D*Math.sin(pitch);
  R.cam.position.set(R3X(R.camS.x), camY, R3Z(R.camS.z)+D*Math.cos(pitch));
  R.cam.lookAt(R3X(R.camS.x), R.camS.y+14, R3Z(R.camS.z));
  R.sun.position.set(R3X(P.x)-260, 430, R3Z(P.y)-260);
  R.sun.target.position.set(R3X(P.x), 0, R3Z(P.y));
  R.rimLight.position.set(R3X(P.x)+300, 280, R3Z(P.y)+300);
  R.rimLight.target.position.set(R3X(P.x), 0, R3Z(P.y));
  /* pollen motes sink slowly, always around the action (3D-look pass) */
  if(!RM){
    const mp=R.motes.geometry.attributes.position;
    for(let i=0;i<mp.count;i++){ const y=mp.getY(i)-0.22; mp.setY(i, y<1?52:y); }
    mp.needsUpdate=true;
    R.motes.position.set(R3X(R.camS.x), 0, R3Z(R.camS.z));
  }
  /* cloud drift */
  if(R.cloud3d){ for(const c of R.cloud3d){ c.group.position.x+=c.speed; if(c.group.position.x>2400) c.group.position.x=-2400; } }
  /* birds circle and bob */
  if(R.bird3){ for(const b of R.bird3){
    b.phase+=b.speed;
    b.group.position.x=b.cx+Math.cos(b.phase)*b.r;
    b.group.position.z=b.cz+Math.sin(b.phase)*b.r;
    b.group.position.y=b.baseY+Math.sin(b.bobPhase+T*0.004)*8;
    b.group.rotation.y=b.phase+Math.PI/2;
  }}
  R.renderer.render(R.scene, R.cam);
  drawMinimap();
}

function tryInteract(){
  if(landmarkSeq){ landmarkSeq.skipped=true; AudioManager.play('success',{frequency:740}); return; }
  if(modal.classList.contains('on')){ closeModal(); return; }
  if(document.getElementById('intro').style.display!=='none') return;
  if(riding){ dismount(); return; }
  const nearA = nearAnimal();
  if(nearA){
    if(nearA.rideable && nearA.affinity>=3 && lastPetAnimal===nearA && (T-lastPetTime)<90 && !R3on){
      mountAnimal(nearA); lastPetAnimal=null; return;
    }
    petAnimal(nearA);
    lastPetAnimal=nearA; lastPetTime=T;
    return;
  }
  if(!near) return;
  if(near.kind==='mountain-feature'){
    interactMountainFeature(near);
    return;
  }
  const isLandmark = near.kind==='landmark';
  if(isLandmark && !near.seen){
    save.landmarkSeen[near.id] = true; writeSave();
    startLandmarkSeq(near);
    AudioManager.play(['railway','aircraft','rocket'].includes(near.id)?'transport':'landmark');
    track('landmark:'+near.id);
    return;
  }
  const first = !near.seen;
  near.seen=true; updateFound();
  if(first) track('panel:'+near.id);
  AudioManager.play(near.secret?'environment':'building');
  openModal(near.title, near.tag, near.html, POSE_BY_ID[near.id]);
}
