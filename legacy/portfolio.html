<style>
  :root{
    --ink:#eef2fa; --ink-dim:#9aa6bf;
    --bg:#0f1a14; --panel:#141b26; --panel-2:#1c2534; --line:#2e3a4f;
    --accent:#ffd166; --accent-2:#4cc9f0; --good:#7ee787;
    --font: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --glass-bg: rgba(255,246,226,.62);
    --glass-bg-dark: rgba(20,27,38,.72);
    --glass-border: rgba(51,36,28,.30);
    --glass-blur: 14px;
    --glass-radius: 14px;
    --glass-shine: linear-gradient(135deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,.06) 100%);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  @media (prefers-reduced-motion: reduce){
    :root{ --glass-blur: 8px; }
    *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
       overflow:hidden; touch-action:none; overscroll-behavior:none;}
  canvas{display:block; image-rendering:pixelated; image-rendering:crisp-edges;}

  #hud{position:fixed; inset:0; pointer-events:none; z-index:5}
  .hud-top{position:absolute; top:0; left:0; right:0; padding:10px 12px;
           display:flex; gap:10px; align-items:flex-start; justify-content:space-between;}
  .badge{background:var(--glass-bg); border:2px solid var(--glass-border); border-radius:var(--glass-radius); padding:7px 11px;
         font-size:12px; line-height:1.4; color:#33241c; box-shadow:0 4px 16px rgba(51,36,28,.14), inset 0 1px 0 rgba(255,255,255,.35);
         -webkit-backdrop-filter:blur(var(--glass-blur)); backdrop-filter:blur(var(--glass-blur));
         background-image:var(--glass-shine);}
  .badge b{color:#c8541f}
  .badge #found{color:#6b5a4a !important}
  .hud-left{display:flex; flex-direction:column; gap:8px; pointer-events:auto}
  .badge.speed{padding:8px 11px}
  .badge.speed label{display:block; font-size:11px; margin-bottom:6px; color:#6b5a4a; cursor:pointer}
  .badge.speed label b{color:#c8541f}
  #spd{-webkit-appearance:none; appearance:none; width:132px; height:10px; margin:0;
       background:#e9d9bb; border:2px solid #33241c; border-radius:6px; cursor:pointer; display:block}
  #spd::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%;
       background:#ffd23f; border:3px solid #33241c; cursor:grab; margin-top:-1px}
  #spd::-webkit-slider-thumb:active{cursor:grabbing; background:#ffb700}
  #spd::-moz-range-thumb{width:15px; height:15px; border-radius:50%; background:#ffd23f;
       border:3px solid #33241c; cursor:grab}
  #spd::-moz-range-track{background:transparent}
  #spd:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .hud-btns{display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end}
  .audio-control{display:flex; align-items:center; gap:6px; padding:5px 8px; background:var(--glass-bg);
                 border:2px solid var(--glass-border); border-radius:var(--glass-radius);
                 -webkit-backdrop-filter:blur(var(--glass-blur)); backdrop-filter:blur(var(--glass-blur));
                 background-image:var(--glass-shine);}
  .audio-control label{font-size:11px; color:#6b5a4a; white-space:nowrap}
  #audioVolume{width:76px; accent-color:#c8541f; cursor:pointer}
  button.k, a.k{font-family:var(--font); font-size:12px; font-weight:700; cursor:pointer;
           background:var(--glass-bg); color:#33241c; border:2px solid var(--glass-border); border-radius:var(--glass-radius);
           padding:7px 11px; box-shadow:0 4px 14px rgba(51,36,28,.12), inset 0 1px 0 rgba(255,255,255,.30);
           -webkit-backdrop-filter:blur(var(--glass-blur)); backdrop-filter:blur(var(--glass-blur));
           background-image:var(--glass-shine);
           transition:transform .12s ease, box-shadow .12s ease, background .18s ease;}
  a.k{text-decoration:none; display:inline-block; line-height:1.4}
  button.k:hover, a.k:hover{background:rgba(255,210,63,.72); background-image:var(--glass-shine);}
  button.k:active, a.k:active{transform:translateY(2px); box-shadow:0 1px 4px rgba(51,36,28,.12)}
  button.k:focus-visible, a.k:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  #prompt{position:absolute; left:50%; bottom:100px; transform:translateX(-50%);
          background:rgba(255,210,63,.82); border:2px solid var(--glass-border); border-radius:var(--glass-radius); color:#33241c;
          font-weight:700; box-shadow:0 6px 20px rgba(51,36,28,.16), inset 0 1px 0 rgba(255,255,255,.40);
          -webkit-backdrop-filter:blur(var(--glass-blur)); backdrop-filter:blur(var(--glass-blur));
          background-image:var(--glass-shine);
          padding:8px 14px; font-size:13px; white-space:nowrap; display:none;
          animation:bob 1.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}

  #toast{position:absolute; left:50%; top:74px; transform:translateX(-50%);
         background:#fff6e2; border:3px solid #33241c; border-radius:10px;
         box-shadow:0 3px 0 #33241c;
         padding:9px 16px; font-size:13px; letter-spacing:.10em; color:#33241c; font-weight:700;
         opacity:0; transition:opacity .35s ease;}
  #toast.on{opacity:1}

  #minimap{position:absolute; right:12px; bottom:12px; width:160px; height:110px;
           background:#fff6e2; border:3px solid #33241c; border-radius:10px;
           box-shadow:0 3px 0 #33241c;}

  #touch{position:absolute; inset:0; display:none; pointer-events:none}
  #stick{position:absolute; left:26px; bottom:26px; width:124px; height:124px;
         border:4px solid rgba(51,36,28,.75); border-radius:50%;
         background:rgba(255,246,226,.45); pointer-events:auto;
         transition:opacity .18s ease; opacity:.55;}
  #stick.live{opacity:1}
  #nub{position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
       border-radius:50%; background:#fff6e2; border:4px solid #33241c;}
  #abtn{position:absolute; right:30px; bottom:44px; width:84px; height:84px; border-radius:50%;
        background:#ffd23f; border:4px solid #33241c; color:#33241c; font-weight:700;
        box-shadow:0 4px 0 #33241c; font-family:var(--font); font-size:15px; pointer-events:auto;
        background-image:var(--glass-shine); cursor:pointer;}
  #abtn:focus-visible{outline:2px solid #c8541f; outline-offset:3px}
  #flybtn{position:absolute; left:30px; bottom:44px; width:84px; height:84px; border-radius:50%;
        background:#4ade80; border:4px solid #33241c; color:#064E3B; font-weight:700;
        box-shadow:0 4px 0 #33241c; font-family:var(--font); font-size:15px; pointer-events:auto;
        background-image:var(--glass-shine); cursor:pointer; display:none; touch-action:none;}
  #flybtn:focus-visible{outline:2px solid #c8541f; outline-offset:3px}

  #modal{position:fixed; inset:0; z-index:20; display:none; touch-action:pan-y; -webkit-overflow-scrolling:touch; background:rgba(5,8,12,.74);
         padding:20px; overflow:auto; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
  #modal.on{display:flex; align-items:center; justify-content:center}
  .card{width:min(720px,100%); background:var(--panel); border:4px solid #33241c; border-radius:14px;
        box-shadow:0 6px 0 #33241c, 0 20px 60px rgba(0,0,0,.35); max-height:86vh; display:flex; flex-direction:column;}
  .card-head{display:flex; align-items:center; gap:16px; padding:16px 18px;
             border-bottom:2px solid var(--line); background:var(--panel-2);}
  #avatar{width:104px; height:104px; flex:0 0 104px; border-radius:50%;
          border:4px solid #33241c; box-shadow:0 4px 0 #33241c; margin:-6px 0 -6px 0;
          background:radial-gradient(circle at 50% 38%, #ffe081 0%, #ffd23f 62%, #f0b429 100%);}
  .card-head h2{margin:0; font-size:18px; letter-spacing:.04em; color:var(--accent)}
  .card-head .tag{font-size:11px; color:var(--ink-dim); margin-left:auto; text-align:right}
  .card-body{padding:16px; overflow:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; font-size:13.5px; line-height:1.75}
  .card-body h3{font-size:13px; color:var(--accent-2); margin:20px 0 6px; letter-spacing:.05em}
  .card-body h3:first-child{margin-top:0}
  .card-body p{margin:0 0 12px}
  .card-body ul{margin:0 0 12px; padding-left:18px}
  .card-body li{margin:0 0 6px}
  .card-body a{color:var(--accent)}
  .card-foot{padding:10px 16px; border-top:2px solid var(--line); text-align:right;
             font-size:11px; color:var(--ink-dim)}
  .cform{margin:0 0 14px}
  .cform input, .cform textarea{
    width:100%; box-sizing:border-box; font-family:var(--font); font-size:13px;
    background:var(--panel-2); color:var(--ink); border:2px solid var(--line);
    border-radius:8px; padding:9px 11px; margin:0 0 9px; resize:vertical;}
  .cform input:focus, .cform textarea:focus{outline:none; border-color:var(--accent)}
  .cform input::placeholder, .cform textarea::placeholder{color:#6b7890}
  .cform-row{display:flex; gap:9px; flex-wrap:wrap}
  .cbtn{font-family:var(--font); font-size:12.5px; font-weight:700; cursor:pointer;
    background:var(--accent); color:#33241c; border:2px solid #33241c; border-radius:9px;
    padding:9px 14px; box-shadow:0 3px 0 #33241c;}
  .cbtn:hover{background:#ffe081}
  .cbtn:active{transform:translateY(3px); box-shadow:none}
  .cbtn.ghost{background:var(--panel-2); color:var(--ink); border-color:var(--line); box-shadow:0 3px 0 var(--line)}
  .cbtn.ghost:hover{border-color:var(--accent); color:var(--accent)}
  .chint{font-size:11.5px; color:var(--ink-dim); margin:10px 0 0}
  .store{display:inline-block; border:2px solid var(--line); background:var(--panel-2);
         border-radius:9px; padding:7px 12px; margin:0 8px 8px 0; font-size:12px;
         text-decoration:none; color:var(--ink) !important;}
  .store:hover{border-color:var(--accent); color:var(--accent) !important}
  .pill{display:inline-block; border:1px solid var(--line); background:var(--panel-2);
        padding:3px 8px; margin:0 5px 6px 0; font-size:11.5px}
  .meter{height:8px; background:var(--panel-2); border:1px solid var(--line); margin:4px 0 12px}
  .meter i{display:block; height:100%; background:var(--accent-2)}
  .row{display:flex; gap:10px; align-items:baseline; margin:0 0 3px}
  .row .yr{color:var(--ink-dim); font-size:11.5px; min-width:104px}

  #intro{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
         padding:22px; text-align:center; overflow:hidden; isolation:isolate;}
  #intro::before{content:""; position:absolute; inset:0; z-index:-1;
         background:linear-gradient(rgba(11,31,26,.10) 0%, rgba(11,31,26,.56) 100%),
                    url('assets/solarpunk-city.jpg') center/cover no-repeat #0b1f1a;
         filter:blur(6px); transform:scale(1.05);}
  #intro .box{max-width:640px; position:relative; display:flex; flex-direction:column; align-items:center}
  #intro .badge-pill{display:inline-flex; align-items:center; gap:8px; padding:7px 14px; margin:0 0 18px;
              border-radius:999px;
              background:linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(224,242,254,.28) 100%);
              border:1px solid rgba(255,255,255,.45);
              -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
              box-shadow:0 4px 14px rgba(31,38,135,.10), inset 0 1px 0 rgba(255,255,255,.55);
              font-family:var(--font); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
              color:#064E3B; font-weight:700; animation:floatSlow 4s ease-in-out infinite;}
  #intro .badge-pill i{width:8px; height:8px; border-radius:50%; background:#EAB308;
              box-shadow:0 0 8px rgba(234,179,8,.85)}
  #intro h1{font-size:clamp(24px,5vw,38px); margin:0 0 10px; letter-spacing:.05em; color:#ffffff;
            text-transform:uppercase;
            font-family:"Space Grotesk","Outfit","Segoe UI",system-ui,sans-serif;
            text-shadow:0 2px 18px rgba(6,78,59,.55), 0 1px 3px rgba(6,78,59,.6)}
  #intro .fh-sub{color:#FDE047; font-weight:700; letter-spacing:.03em}
  .foot-hud{position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    width:calc(100% - 40px);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 14px;
    padding:16px 20px; border-radius:14px; z-index:1;
    background:linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(224,242,254,.28) 100%);
    border:1px solid rgba(255,255,255,.5);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    box-shadow:0 8px 24px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.55);
    font-family:var(--font); font-size:11px; letter-spacing:.05em; color:#f1f5f9;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    -webkit-user-select:none; user-select:none;}
  .foot-hud b{color:#86EFAC}
  .keys{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:0 0 26px}
  .key{border:1px solid rgba(255,255,255,.9); border-radius:14px;
       background:linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%);
       box-shadow:0 3px 0 #CBD5E1, 0 6px 12px rgba(15,23,42,.10);
       padding:10px 14px; font-size:11.5px; color:#334155; font-family:var(--font);
       display:flex; align-items:center; gap:7px; transition:transform .15s ease, box-shadow .15s ease;}
  .key:hover{transform:translateY(-2px); box-shadow:0 5px 0 #94A3B8, 0 10px 18px rgba(14,165,233,.20)}
  .key b{font-weight:700; letter-spacing:.08em; padding:3px 7px; border-radius:6px; font-size:11px; color:#92400e}
  .key .k-wasd{background:#dcfce7; color:#065f46}
  .key .k-e{background:#fef3c7; color:#92400e}
  .key em{font-style:normal; color:#8899a6; font-size:11px}
  .cta-wrap{position:relative; width:100%; max-width:430px; margin:0 auto}
  .cta-wrap::before{content:""; position:absolute; inset:-6px; border-radius:20px; z-index:0;
           background:linear-gradient(90deg, rgba(251,191,36,.50), rgba(74,222,128,.45), rgba(251,191,36,.55));
           opacity:.7; filter:blur(14px); transition:opacity .3s, transform .3s}
  .cta-wrap:hover::before{opacity:1; transform:scale(1.02)}
  #btnStart{position:relative; z-index:1; width:100%; font-size:15px; padding:15px 22px;
       border-radius:16px; font-weight:800; font-family:var(--font); cursor:pointer; letter-spacing:.05em;
       background:linear-gradient(180deg, #FDE047 0%, #EAB308 50%, #CA8A04 100%);
       border:2px solid #FEF08A; color:#1c1917; text-shadow:0 1px 1px rgba(255,255,255,.6);
       box-shadow:0 5px 0 #854D0E, 0 12px 28px rgba(202,138,4,.45);
       transition:transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s cubic-bezier(.16,1,.3,1), filter .18s}
  #btnStart:hover{transform:translateY(-3px); box-shadow:0 8px 0 #854D0E, 0 18px 36px rgba(234,179,8,.6); filter:brightness(1.05)}
  #btnStart:active{transform:translateY(2px); box-shadow:0 2px 0 #854D0E, 0 6px 16px rgba(202,138,4,.4)}
  #btnStart:focus-visible{outline:3px solid #7DD3FC; outline-offset:3px}
  .quiet{font-size:11.5px; color:rgba(255,255,255,.85); margin-top:16px; text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .quiet a{color:#FDE047; text-decoration:underline; text-underline-offset:2px}
  @keyframes floatSlow{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
  #intro .pollen{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  #intro .pollen-dot{position:absolute; border-radius:50%; pointer-events:none;
       background:radial-gradient(circle, #fef08a 20%, rgba(254,240,138,0) 70%);
       animation:driftPollen 10s ease-in-out infinite}
  @keyframes driftPollen{0%{transform:translate(0,0) rotate(0deg); opacity:.3}
       50%{transform:translate(40px,-60px) rotate(180deg); opacity:.85}
       100%{transform:translate(80px,-120px) rotate(360deg); opacity:0}}

  #classic{position:fixed; inset:0; z-index:25; display:none; overflow:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch;
           background:var(--bg); padding:0 20px 80px;}
  #classic.on{display:block}
  .wrap{max-width:760px; margin:0 auto}
  #classic header{padding:64px 0 34px; border-bottom:2px solid var(--line); margin-bottom:34px}
  #classic h1{font-size:clamp(24px,5vw,36px); margin:0 0 8px; letter-spacing:.06em}
  #classic .role{color:var(--accent); font-size:14px; margin:0 0 14px}
  #classic .blurb{color:var(--ink-dim); font-size:13.5px; line-height:1.8; margin:0}
  .sec{margin:0 0 40px}
  .sec > h2{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-2);
            border-bottom:1px solid var(--line); padding-bottom:8px; margin:0 0 16px}
  .sec .card-body{padding:0}
  #classic .back{position:fixed; top:14px; right:16px; z-index:26}

  /* --- small screens: keep the minimap clear of the LOOK button --- */
  @media (max-width:600px), (pointer:coarse){
    button.k, a.k{font-size:11px; padding:7px 9px}
    #minimap{width:104px; height:72px; bottom:auto; top:150px; right:10px}
    #spd{width:110px}
    #avatar{width:72px; height:72px; flex:0 0 72px; margin:0}
    .card-head h2{font-size:15px}
    #prompt{bottom:150px; font-size:12px; padding:7px 11px}
    #toast{top:auto; bottom:212px; font-size:12px}
  }
</style>

<body>

<canvas id="game"></canvas>

<div id="hud">

/* ==================================================================
   0.  ANALYTICS  —  optional, privacy-friendly, off by default.
       Set ANALYTICS.provider to 'goatcounter', 'plausible' or 'umami'
       and fill in the matching field. Leave it as null and nothing loads,
       no requests are made and no cookies are set.

       goatcounter : free, no cookies — sign up at goatcounter.com,
                     then site: 'yourname'   (from yourname.goatcounter.com)
       plausible   : paid — domain: 'yourdomain.com'
       umami       : self-hosted — src: 'https://your-umami/script.js',
                     websiteId: '...'
   ================================================================== */
const ANALYTICS = {
  provider: null,          // 'goatcounter' | 'plausible' | 'umami' | null
  site: '',                // goatcounter code
  domain: '',              // plausible domain
  src: '', websiteId: ''   // umami
};

(function loadAnalytics(){
  const a = ANALYTICS;
  if(!a.provider) return;
  const el = document.createElement('script');
  el.async = true;
  if(a.provider === 'goatcounter'){
    el.src = 'https://gc.zgo.at/count.js';
    el.setAttribute('data-goatcounter', 'https://' + a.site + '.goatcounter.com/count');
  } else if(a.provider === 'plausible'){
    el.src = 'https://plausible.io/js/script.js';
    el.setAttribute('data-domain', a.domain);
  } else if(a.provider === 'umami'){
    el.src = a.src;
    el.setAttribute('data-website-id', a.websiteId);
  } else return;
  document.head.appendChild(el);
})();

/* One call site for everything worth knowing about a playable page:
   did they start, what did they read, did they finish, did they bail to the
   plain version. No-ops entirely when analytics is switched off. */
function track(name, extra){
  try{
    if(!ANALYTICS.provider) return;
    if(window.goatcounter && window.goatcounter.count)
      window.goatcounter.count({path:'event/'+name, title:name, event:true});
    else if(window.plausible) window.plausible(name, extra ? {props:extra} : undefined);
    else if(window.umami && window.umami.track) window.umami.track(name, extra);
  }catch(e){}
}

/* ==================================================================
   2.  WORLD
   ================================================================== */
const TILE = 16, MAP_W = 300, MAP_H = 200;
const W = MAP_W*TILE, H = MAP_H*TILE;

/* terrain codes */
const GRASS=0, PATH=1, WATER=2, FLOOR=3, WALL=4, TREE=5, SAND=6, ROCK=7, DESERT=8, RAIL=9, RUNWAY=10;

const cvs = document.getElementById('game');
let ctx = cvs.getContext('2d');
const mm  = document.getElementById('minimap');
const mmx = mm.getContext('2d');

/* deterministic per-tile noise */
function hash(x,y){ let n = x*374761393 + y*668265263; n = (n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967296; }

/* ---------- buildings ---------- */
const BUILDINGS = [
  {id:'about', line:"This one's mine. Full-stack work, and the mug I never wash.",  label:'ABOUT',                    x:20,  y:15,  w:12, h:9, door:25,  roof:'#8c4b3a'},
  {id:'games', line:"Cabinets in here — Ludo at scale, enterprise apps, AR and more.",  label:'FEATURED WORK',        x:100, y:20,  w:26, h:9, door:111, roof:'#7a3f5e'},
  {id:'sys', line:"The unglamorous building. Services, Odoo, smart contracts, streams.",    label:'SYSTEMS & TOOLING',        x:200, y:15,  w:12, h:9, door:205, roof:'#3f5f7a'},
  {id:'multi', line:"Games, chains and apps with strangers and servers in them.",  label:'GAMES & REALTIME',x:30, y:80, w:22, h:9, door:39, roof:'#8a6b34'},
  {id:'craft', line:"My toolbox. Languages, frameworks, XR and clouds.",  label:'CRAFT',                    x:150, y:100, w:12, h:9, door:155, roof:'#4a7a52'},
  {id:'xr', line:"In here: VR painting, hand tracking, and AR that ships.",     label:'AR / VR & RESEARCH', x:230,  y:80, w:24, h:9, door:240, roof:'#5b4a86'},
  {id:'career', line:"Five years on a whiteboard. Dhaka, distributed teams, games to enterprise.", label:'CAREER',                   x:80, y:150, w:15, h:9, door:86, roof:'#7a5a3a'},
  {id:'contact', line:"The terminal. If you want to talk, this is where you'd do it.",label:'CONTACT',                  x:200, y:150, w:11, h:9, door:204, roof:'#3f6f6a'}
];
BUILDINGS.forEach(b=>{ b.a=1; b.at=1; });

/* pond */
const POND = {cx:150, cy:90, rx:15, ry:10};
function inPond(tx,ty){
  const dx=(tx-POND.cx)/POND.rx, dy=(ty-POND.cy)/POND.ry;
  return dx*dx+dy*dy <= 1;
}
function pondEdge(tx,ty){
  const dx=(tx-POND.cx)/(POND.rx+1.1), dy=(ty-POND.cy)/(POND.ry+1.1);
  return dx*dx+dy*dy <= 1;
}

/* ---------- terrain ---------- */
const map = [];
for(let y=0;y<MAP_H;y++){ map[y]=[]; for(let x=0;x<MAP_W;x++) map[y][x]=GRASS; }

/* pond + sandy shore */
for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
  if(inPond(x,y)) map[y][x]=WATER;
}

/* paths */
function lay(x,y,c){ if(map[y]&&map[y][x]!==undefined && map[y][x]===GRASS) map[y][x]=c; }
function forceLay(x,y,c){ if(map[y]&&map[y][x]!==undefined) map[y][x]=c; }

/* main road network: large cross + ring around pond */
for(let x=60;x<=240;x++){ lay(x,50,PATH); lay(x,51,PATH); }
for(let x=60;x<=240;x++){ lay(x,140,PATH); lay(x,141,PATH); }
for(let y=20;y<=180;y++){ lay(120,y,PATH); lay(121,y,PATH); }
for(let y=20;y<=180;y++){ lay(180,y,PATH); lay(181,y,PATH); }
for(let x=120;x<=181;x++){ lay(x,95,PATH); lay(x,96,PATH); }
for(let x=120;x<=181;x++){ lay(x,105,PATH); lay(x,106,PATH); }
for(let y=95;y<=106;y++){ lay(118,y,PATH); lay(119,y,PATH); }
for(let y=95;y<=106;y++){ lay(182,y,PATH); lay(183,y,PATH); }

/* diagonal connecting paths between main roads */
for(let i=0;i<=60;i++){ lay(60+i,50+i,PATH); lay(61+i,51+i,PATH); }
for(let i=0;i<=60;i++){ lay(180-i,50+i,PATH); lay(181-i,51+i,PATH); }
for(let i=0;i<=40;i++){ lay(60+i,140-i,PATH); lay(61+i,141-i,PATH); }
for(let i=0;i<=40;i++){ lay(240-i,140-i,PATH); lay(241-i,141-i,PATH); }
for(let i=0;i<=50;i++){ lay(120-i,95-i,PATH); lay(121-i,96-i,PATH); }
for(let i=0;i<=50;i++){ lay(181+i,95-i,PATH); lay(182+i,96-i,PATH); }

/* stubs from each building door to nearest road */
BUILDINGS.forEach(b=>{
  const dy=b.y+b.h;
  let targetY;
  if(dy<95) targetY=50;
  else if(dy<140) targetY=140;
  else targetY=180;
  const from=Math.min(dy,targetY), to=Math.max(dy,targetY);
  for(let y=from;y<=to;y++){ lay(b.door,y,PATH); lay(b.door+1,y,PATH); }
});

/* border trees + scattered woods */
for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
  if(x<2||y<2||x>MAP_W-3||y>MAP_H-3){ map[y][x]=TREE; continue; }
  if(map[y][x]===GRASS && hash(x,y)>0.942) map[y][x]=TREE;
}

/* ---------- expanded world regions ---------- */
/* mountains: outer edges (N, E, W, S) */
for(let y=1;y<25;y++) for(let x=1;x<MAP_W-1;x++){
  if(map[y][x]===GRASS){
    const h=hash(x,y);
    if(h>0.65) map[y][x]=ROCK;
    else if(h>0.45) map[y][x]=TREE;
  }
}
for(let y=1;y<MAP_H-1;y++) for(let x=1;x<15;x++){
  if(map[y][x]===GRASS){
    const h=hash(x,y);
    if(h>0.70) map[y][x]=ROCK;
    else if(h>0.55) map[y][x]=TREE;
  }
}
for(let y=1;y<MAP_H-1;y++) for(let x=MAP_W-15;x<MAP_W-1;x++){
  if(map[y][x]===GRASS){
    const h=hash(x,y);
    if(h>0.70) map[y][x]=ROCK;
    else if(h>0.55) map[y][x]=TREE;
  }
}
for(let y=MAP_H-20;y<MAP_H-1;y++) for(let x=1;x<MAP_W-1;x++){
  if(map[y][x]===GRASS){
    const h=hash(x,y);
    if(h>0.72) map[y][x]=ROCK;
    else if(h>0.55) map[y][x]=TREE;
  }
}
/* desert: SE corner */
for(let y=140;y<MAP_H-20;y++) for(let x=240;x<MAP_W-15;x++){
  if(map[y][x]===GRASS){
    const h=hash(x,y);
    if(h>0.82) map[y][x]=ROCK;
    else map[y][x]=DESERT;
  }
}
/* south gardens: dense trees in the SW */
for(let y=140;y<MAP_H-20;y++) for(let x=15;x<100;x++){
  if(map[y][x]===GRASS && hash(x+99,y+77)>0.88) map[y][x]=TREE;
}
/* rail track through SE */
for(let x=250;x<MAP_W-10;x++){ lay(x,160,RAIL); lay(x,161,RAIL); }
for(let x=255;x<270;x++){ lay(x,168,RUNWAY); lay(x,169,RUNWAY); lay(x,170,RUNWAY); }
/* path connecting railway station area */
for(let x=240;x<=260;x++){ lay(x,155,PATH); lay(x,156,PATH); }
for(let y=141;y<=160;y++){ lay(245,y,PATH); lay(246,y,PATH); }
/* path to mountain peak area (260,10) - walkable switchback */
for(let y=25;y>=15;y--){ forceLay(258,y,PATH); forceLay(259,y,PATH); }
for(let x=250;x<=265;x++){ forceLay(x,15,PATH); forceLay(x,16,PATH); }
for(let y=15;y>=8;y--){ forceLay(263,y,PATH); forceLay(264,y,PATH); }
for(let x=255;x<=270;x++){ forceLay(x,25,PATH); }
/* level 5 crossing */
for(const [bx,by] of [[255,15],[256,15],[257,15],[258,15]]) forceLay(bx,by,PATH);
/* pond outlet: short stream feeding the river */
for(let y=80;y<=85;y++){
  if(map[y] && (map[y][165]===GRASS || map[y][165]===TREE)) map[y][165]=WATER;
}
/* winding river through the center from top to bottom */
for(let y=1;y<MAP_H-1;y++){
  const rx = 165 + Math.round(Math.sin(y*0.04)*12 + Math.cos(y*0.07)*6);

/* ==================================================================
   WATER — software shader over the pond.
   Layers, after godotshaders.com/shader/2d-water-for-topdown-games:
     fbm wave field · expanding ripple emitters · normals -> specular
     · depth-blended colour · animated shoreline foam
   ================================================================== */
const WPAD = 2;
const WX0 = Math.floor(POND.cx-POND.rx-WPAD), WY0 = Math.floor(POND.cy-POND.ry-WPAD);
const WX1 = Math.ceil (POND.cx+POND.rx+WPAD), WY1 = Math.ceil (POND.cy+POND.ry+WPAD);
const WSC = 2;                                   // world px per water pixel
const WPW = (WX1-WX0)*TILE/WSC, WPH = (WY1-WY0)*TILE/WSC;

const wcv = document.createElement('canvas');
wcv.width = WPW; wcv.height = WPH;
const wctx = wcv.getContext('2d', {willReadFrequently:true});
const wimg = wctx.createImageData(WPW, WPH);
const wbuf = new Uint32Array(wimg.data.buffer);
const wDepth = new Float32Array(WPW*WPH);       // 0 at the shoreline, 1 mid-pond
const wRad   = new Float32Array(WPW*WPH);       // normalised radius, for the shore band
const wH     = new Float32Array(WPW*WPH);       // height field

function ihash(x,y){
  let n = (x|0)*374761393 + (y|0)*668265263;
  n = (n ^ (n>>13)) * 1274126177;
  return ((n ^ (n>>16))>>>0) / 4294967296;
}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=ihash(xi,yi), b=ihash(xi+1,yi), c=ihash(xi,yi+1), d=ihash(xi+1,yi+1);
  return (a+(b-a)*u) + ((c+(d-c)*u) - (a+(b-a)*u))*v;
}
function fbm(x,y){
  /* rotated octaves, as in the reference shader */
  let f = vnoise(x,y)*0.55;
  const rx =  x*0.80 + y*0.60, ry = -x*0.60 + y*0.80;
  f += vnoise(rx*2.1, ry*2.1)*0.30;
  f += vnoise(x*4.3 - 11.7, y*4.3 + 5.1)*0.15;
  return f;
}

/* depth mask: soft distance to the pond boundary, with a wobbly edge */
(function bakeDepth(){
  for(let py=0; py<WPH; py++) for(let px2=0; px2<WPW; px2++){
    const wx = WX0*TILE + px2*WSC, wy = WY0*TILE + py*WSC;
    const tx = wx/TILE, ty = wy/TILE;
    const wob = (vnoise(tx*1.6, ty*1.6)-0.5)*0.10;
    const dx=(tx-POND.cx)/POND.rx, dy=(ty-POND.cy)/POND.ry;
    const r = Math.sqrt(dx*dx+dy*dy) + wob;
    wRad[py*WPW+px2]   = r;
    wDepth[py*WPW+px2] = r>=1 ? -1 : Math.min(1, (1-r)/0.34);
  }
})();

/* ripple emitters */
const emitters = [];
function emit(wx, wy, strength){
  if(emitters.length>8) emitters.shift();
  emitters.push({x:(wx-WX0*TILE)/WSC, y:(wy-WY0*TILE)/WSC, t:0, s:strength||1});
}
let emitTick=0;

function updateWater(){
  emitTick++;
  if(emitTick%46===0){
    const a=Math.random()*6.283, r=Math.sqrt(Math.random());
    emit((POND.cx + Math.cos(a)*POND.rx*0.8*r)*TILE,
         (POND.cy + Math.sin(a)*POND.ry*0.8*r)*TILE, 0.75);
  }
  if(emitTick%26===0) emit(mother.x, mother.y+2, 1.15);
  for(let i=emitters.length-1;i>=0;i--){
    emitters[i].t += 1;
    if(emitters[i].t>210) emitters.splice(i,1);
  }
}

const RIPPLE_STRENGTH = 0.9, HIGHLIGHT_POW = 16;
function renderWater(){
  const t = T*0.016;
  const active=[], nAct0=emitters.length;
  for(let k=0;k<nAct0;k++){
    const e=emitters[k];
    e.rad = e.t*0.31;
    const f = 1 - e.t/210; e.fade = f*f;
    e.rMax = e.rad + 6;
    if(e.fade>0.01) active.push(e);
  }
  const nAct=active.length;

  /* pass 1 — height field */
  for(let py=0; py<WPH; py++){
    for(let px2=0; px2<WPW; px2++){
      const idx=py*WPW+px2;
      if(wDepth[idx]<0){ wH[idx]=0; continue; }
      const x=px2, y=py;
      /* drifting fbm swell */
      let h = fbm(x*0.090 + t*0.35, y*0.090 - t*0.22)*0.92;
      /* two crossing sine waves */
      h += Math.sin(x*0.22 + y*0.12 + t*1.9)*0.22;
      h += Math.sin(x*0.12 - y*0.26 - t*1.4)*0.18;
      /* fine chop, so the swell doesn't read as blotches */
      h += (vnoise(x*0.52 + t*2.1, y*0.52 - t*1.5)-0.5)*0.34;
      /* expanding ripples */
      for(let k=0;k<nAct;k++){
        const e=active[k];
        const dy=(y-e.y)*1.9;
        if(dy>e.rMax || dy<-e.rMax) continue;
        const dx=x-e.x;
        if(dx>e.rMax || dx<-e.rMax) continue;
        const d=Math.sqrt(dx*dx+dy*dy);
        const age=e.t, radius=age*0.62;
        const band=Math.abs(d-radius);
        if(band<6){
          h += Math.sin((d-radius)*1.10) * (1-band/6) * e.fade * RIPPLE_STRENGTH * e.s;
        }
      }
      wH[idx]=h;
    }
  }

  /* pass 2 — normals, specular, colour */
  for(let py=0; py<WPH; py++){
    for(let px2=0; px2<WPW; px2++){
      const idx=py*WPW+px2;
      const dep=wDepth[idx];
      if(dep<0){
        const rad=wRad[idx];
        if(rad<1.14){                                   // sandy shore, smooth-edged
          const n=vnoise(px2*0.30, py*0.30);
          const near = rad < 1.04+n*0.04;
          wbuf[idx] = (255<<24) | ((near?126:143)<<16) | ((near?214:224)<<8) | (near?238:243);
        } else wbuf[idx]=0;
        continue;
      }

      const l = px2>0 ? wH[idx-1] : wH[idx];
      const r = px2<WPW-1 ? wH[idx+1] : wH[idx];
      const u = py>0 ? wH[idx-WPW] : wH[idx];
      const dn= py<WPH-1 ? wH[idx+WPW] : wH[idx];
      let nx=(l-r)*1.5, ny=(u-dn)*1.5;
      const nl=Math.sqrt(nx*nx+ny*ny+1); nx/=nl; ny/=nl;
      const nz=1/nl;

      /* directional light from the upper left */
      let spec = nx*(-0.62) + ny*(-0.62) + nz*0.48;
      spec = spec>0 ? Math.pow(spec, HIGHLIGHT_POW) : 0;

      /* cartoon cel water: a handful of flat bands, hard edges */
      const hv = wH[idx];
      const v  = dep - hv*0.16;                 // waves push the band edges around
      let R,G,B;
      if(v < 0.16){ R=150; G=235; B=250; }      // shallow
      else if(v < 0.42){ R= 80; G=212; B=240; } // mid
      else { R= 45; G=175; B=220; }             // deep
      /* crest lines and specular read as flat white flecks */
      if(hv > 0.66 || spec > 0.42){ R=246; G=253; B=255; }
      /* shoreline foam */
      if(dep < 0.17){
        const f = 1 - dep/0.17;
        const churn = fbm(px2*0.36 + t*1.1, py*0.36 - t*0.8);
        if(f*f*(0.5+churn*0.95) > 0.34){ R=255; G=255; B=255; }
      }

      wbuf[idx] = (255<<24) | (B<<16) | (G<<8) | R;
    }
  }
  wctx.putImageData(wimg,0,0);
}

const REEDS = [];
(function seedReeds(){
  let seed = 1337;
  const rnd = ()=>{ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; };
  for(let i=0;i<430;i++){
    const a = rnd()*Math.PI*2;
    const k = 1.14 + Math.pow(rnd(), 0.8)*0.44;          // just outside the shore, thinning outward
    const tx = POND.cx + Math.cos(a)*POND.rx*k;
    const ty = POND.cy + Math.sin(a)*POND.ry*k;
    const ix = Math.floor(tx), iy = Math.floor(ty);
    if(ix<1||iy<1||ix>=MAP_W-1||iy>=MAP_H-1) continue;
    if(map[iy][ix]!==GRASS) continue;
    if(objSolidHas(ix,iy)) continue;
    const dens = 1 - (k-1.14)/0.44;                        // thicker near the water
    if(rnd() > 0.26 + dens*0.48) continue;
    REEDS.push({
      x:  tx*TILE + (rnd()-0.5)*10,
      y:  ty*TILE + (rnd()-0.5)*10,
      hb: Math.min(2, (rnd()*2.2 + dens*0.9)|0),           // height bucket
      sc: 1.05 + rnd()*0.5,                               // per-clump scale
      ph: rnd()*6.283,
      cat: rnd() < 0.15,
      tint: rnd()
    });
  }
})();

function say(text, ms){
  const dur = ms || 210;
  bubble = { text: text, born: T, until: T + dur, lines: null };
}
function maybeChatter(){
  if(bubble) return;
  if(!P.moving) return;
  if(T - lastIdle < idleGap) return;
  lastIdle = T;
  idleGap = 520 + Math.random()*640;
  let i;
  do { i = Math.floor(Math.random()*IDLE_LINES.length); } while(i === saidIdx && IDLE_LINES.length > 1);
  saidIdx = i;
  say(IDLE_LINES[i], 230);
}
/* standing outside a door: say what that building is about, once per approach */
function doorChatter(){
  if(insideB){ doorSpoken = null; return; }
  let closest = null, cd = 1e9;
  for(const b of BUILDINGS){
    const dx = P.x - (b.door*TILE + TILE/2);
    const dy = P.y - ((b.y + b.h)*TILE + 6);
    const d = Math.hypot(dx, dy);
    if(d < 40 && d < cd){ cd = d; closest = b; }
  }
  if(!closest){ if(cd > 90) doorSpoken = null; return; }
  if(doorSpoken === closest.id) return;
  doorSpoken = closest.id;
  if(closest.line) say(closest.line, 260);
}

/* ---------- collision ---------- */
function solidTile(t){ return t===WALL || t===WATER || t===TREE || t===ROCK; }
function solidAt(px,py){
  const tx = Math.floor(px/TILE), ty = Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return true;
  if(solidTile(map[ty][tx])) return true;
  const key = tx+','+ty;
  return objSolid.has(key) || propSolid.has(key);
}
function canMove(nx,ny){
  const hw=P.w/2, hh=P.h/2-2;
  return !(solidAt(nx-hw,ny-hh)||solidAt(nx+hw-1,ny-hh)||solidAt(nx-hw,ny+hh)||solidAt(nx+hw-1,ny+hh));
}

  if(tx<1||ty<1||tx>=MAP_W-1||ty>=MAP_H-1) return false;

  if(t!==GRASS && t!==PATH && t!==SAND && t!==DESERT && t!==RAIL && t!==RUNWAY) return false;
  return !objSolid.has(tx+','+ty) && !propSolid.has(tx+','+ty);
}

function critterRnd(){ critterSeed = (critterSeed * 1103515245 + 12345) & 0x7fffffff; return critterSeed / 0x7fffffff; }
const cows = [];
const COW_NAMES = ['Mallow','Pepper','Pudding','Clover','Biscuit'];
for(let i=0;i<5;i++){
  let tx,ty,tries=0;
  do{ tx=2+Math.floor(critterRnd()*(MAP_W-4)); ty=2+Math.floor(critterRnd()*(MAP_H-4)); tries++; }
  while(!walkableForCow(tx,ty) && tries<400);
  cows.push({id:'cow'+i, name:COW_NAMES[i], x:tx*TILE+8, y:ty*TILE+8, vx:0, vy:0, t:critterRnd()*200, face:1, graze:0});
}
const duckPath = [];
const mother = {id:'duck-mother', name:'Marigold', x:POND.cx*TILE, y:POND.cy*TILE, a:critterRnd()*6.28, t:0};
const DUCKLING_NAMES = ['Pebble','Pip','Puddle','Poppy','Plume'];
const ducklings = [0,1,2,3,4].map(i=>({i, id:'duckling'+i, name:DUCKLING_NAMES[i], x:mother.x, y:mother.y}));

function updateCritters(){
  /* cows: wander, pause to graze */
  for(const c of cows){
    c.t--;
    if(c.t<=0){
      c.t = 90 + Math.random()*220;
      if(Math.random()<0.45){ c.vx=0; c.vy=0; c.graze=60+Math.random()*120; }
      else{
        const a = Math.random()*Math.PI*2;
        c.vx = Math.cos(a)*0.22; c.vy = Math.sin(a)*0.22;
        if(Math.abs(c.vx)>0.02) c.face = c.vx>0?1:-1;
      }
    }
    if(c.graze>0){ c.graze--; continue; }
    const nx=c.x+c.vx, ny=c.y+c.vy;
    if(walkableForCow(Math.floor(nx/TILE), Math.floor(c.y/TILE))) c.x=nx; else { c.vx*=-1; c.face=c.vx>0?1:-1; }
    if(walkableForCow(Math.floor(c.x/TILE), Math.floor(ny/TILE))) c.y=ny; else c.vy*=-1;
  }
  /* mother duck paddles inside the pond, ducklings trail behind */
  mother.t += 0.02;
  mother.a += (Math.sin(mother.t*1.7)*0.06);
  let nx = mother.x + Math.cos(mother.a)*0.42;
  let ny = mother.y + Math.sin(mother.a)*0.42;
  if(!inPond(nx/TILE, ny/TILE)){
    const toC = Math.atan2(POND.cy*TILE-mother.y, POND.cx*TILE-mother.x);
    mother.a = toC + (Math.random()-0.5)*0.6;
    nx = mother.x + Math.cos(mother.a)*0.42; ny = mother.y + Math.sin(mother.a)*0.42;
  }
  mother.x=nx; mother.y=ny;
  duckPath.unshift({x:mother.x, y:mother.y});
  if(duckPath.length>140) duckPath.pop();
  ducklings.forEach((d,i)=>{
    const p = duckPath[Math.min(duckPath.length-1, 18+i*16)];
    if(p){ d.x=p.x; d.y=p.y; }
  });
}

/* ---------- versioned localStorage ---------- */
const SAVE_KEY = 'pahlwan-village-v2';
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return {v:2, affinity:{}, ridden:{}, landmarkSeen:{}};
    const s = JSON.parse(raw);
    if(!s || s.v!==2 || typeof s!=='object') return {v:2, affinity:{}, ridden:{}, landmarkSeen:{}};
    const affinity={}, ridden={}, landmarkSeen={}, care={};
    for(const [id,value] of Object.entries(s.affinity||{}))
      if(/^(?:cow|rabbit|goat|deer)\d+$/.test(id)) affinity[id]=Math.max(0,Math.min(10,Number(value)||0));
    for(const [id,value] of Object.entries(s.care||{}))
      if(/^(?:cow|rabbit|goat|deer)\d+$/.test(id)) care[id]=Math.max(0,Math.min(20,Number(value)||0));
    for(const [id,value] of Object.entries(s.ridden||{})) if(typeof id==='string'&&value===true) ridden[id]=true;
    for(const [id,value] of Object.entries(s.landmarkSeen||{})) if(typeof id==='string'&&value===true) landmarkSeen[id]=true;
    return {v:2, affinity, care, ridden, landmarkSeen};
  }catch(e){ return {v:2, affinity:{}, ridden:{}, landmarkSeen:{}}; }
}
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
const save = loadSave();
objs.forEach(o=>{ if(save.landmarkSeen[o.id]) o.seen=true; });

/* ---------- ambient animals ---------- */
function walkableForAnimal(tx,ty){
  if(tx<1||ty<1||tx>=MAP_W-1||ty>=MAP_H-1) return false;
  const t = map[ty][tx];
  if(t!==GRASS && t!==PATH && t!==SAND && t!==DESERT) return false;
  return !objSolid.has(tx+','+ty) && !propSolid.has(tx+','+ty);
}
const rabbits = [];
const RABBIT_NAMES = ['Nibbles','Cocoa','Thistle','Button','Mochi','Dandelion'];
(function seedRabbits(){
  for(let i=0;i<6;i++){
    let tx,ty,tries=0;
    do{ tx=2+Math.floor(critterRnd()*(MAP_W-4)); ty=2+Math.floor(critterRnd()*(MAP_H-4)); tries++; }
    while(!walkableForAnimal(tx,ty) && tries<400);
    rabbits.push({x:tx*TILE+8, y:ty*TILE+8, vx:0, vy:0, t:critterRnd()*200, face:1, hop:0, id:'rabbit'+i, name:RABBIT_NAMES[i],
      affinity: save.affinity['rabbit'+i]||0, care: save.care?.['rabbit'+i]||0, petting:0});
  }
})();
const goats = [];
const GOAT_NAMES = ['Juniper','Fennel','Honey','Maple'];

    do{ tx=66+Math.floor(critterRnd()*26); ty=2+Math.floor(critterRnd()*16); tries++; }
    while(!walkableForAnimal(tx,ty) && tries<400);
    goats.push({x:tx*TILE+8, y:ty*TILE+8, vx:0, vy:0, t:critterRnd()*200, face:1, graze:0, id:'goat'+i, name:GOAT_NAMES[i],

      affinity: save.affinity['deer'+i]||0, care: save.care?.['deer'+i]||0, petting:0, rideable:true, mounted:false});

cows.forEach((c,i)=>{ c.id='cow'+i; c.name=COW_NAMES[i]; c.affinity=save.affinity['cow'+i]||0; c.care=save.care?.['cow'+i]||0; c.petting=0; c.rideable=true; c.mounted=false; });

let riding = null;
let lastPetAnimal = null, lastPetTime = 0;

/* ---------- animal interaction ---------- */
const MAX_AFFINITY = 10;
function nearAnimal(){
  let best=null, bd=1e9;
  const all = [...cows,...rabbits,...goats,...deer];
  for(const a of all){
    const d=Math.hypot(P.x-a.x, P.y-a.y);
    if(d<28 && d<bd){ bd=d; best=a; }
  }
  return best;
}
function petAnimal(a){
  if(!a) return;
  a.petting = 30;
  if(a.affinity < MAX_AFFINITY) a.affinity++;
  a.care = Math.min(20, (a.care||0) + 1);
  save.affinity[a.id] = a.affinity;
  save.care = save.care || {};
  save.care[a.id] = a.care;
  writeSave();
  AudioManager.play('animal',{frequency:720 + a.affinity*40});
  const hearts = ['likes that.','trusts you more.','is very fond of you.','loves you!'];
  say(a.name + ' ' + hearts[Math.min(hearts.length-1, Math.floor(a.affinity/3))], 180);
}
function mountAnimal(a){
  if(!a || !a.rideable || a.mounted) return;
  if(a.affinity < 3){ say('Not friendly enough yet. Pet it more.', 180); AudioManager.play('failure'); return; }
  a.mounted = true;
  riding = a;
  save.ridden[a.id] = true;
  writeSave();
  say('Riding ' + a.name + '! WASD to steer, E to dismount.', 200);
  AudioManager.play('success');
}
function dismount(){
  if(!riding) return;
  riding.mounted = false;
  const offsets = [[20,0],[-20,0],[0,20],[0,-20],[20,20],[-20,20],[20,-20],[-20,-20],[28,0],[-28,0],[0,28],[0,-28]];
  let safeX = riding.x + 20, safeY = riding.y + 10;
  for(const [ox,oy] of offsets){
    const tx = riding.x + ox, ty = riding.y + oy;
    if(canMove(tx, ty)){ safeX = tx; safeY = ty; break; }
  }
  P.x = safeX;
  P.y = safeY;
  riding = null;
  say('Dismounted.', 140);
  AudioManager.play('ui',{frequency:440});
}

/* ---------- landmark sequences ---------- */
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let landmarkSeq = null;
function startLandmarkSeq(obj){
  if(landmarkSeq) return;
  landmarkSeq = { obj, frame:0, total: reducedMotion?30:120, paused:false, skipped:false };
}
function updateLandmarkSeq(){
  if(!landmarkSeq) return;
  if(landmarkSeq.paused) return;
  landmarkSeq.frame++;
  if(landmarkSeq.frame >= landmarkSeq.total || landmarkSeq.skipped){
    const o = landmarkSeq.obj;
    landmarkSeq = null;
    o.seen = true; updateFound();
    openModal(o.title, o.tag, o.html, POSE_BY_ID[o.id]||'wave');
  }
}
function drawLandmarkSeq(){
  if(!landmarkSeq) return;
  const s=landmarkSeq, prog=s.frame/s.total;
  ctx.save();
  ctx.fillStyle='rgba(5,8,12,.55)';
  ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.fillStyle=C.cream;
  ctx.font='bold 18px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.fillText(s.obj.title, innerWidth/2, innerHeight/2-30);
  ctx.font='13px system-ui, sans-serif';
  ctx.fillStyle=C.inkDim;
  ctx.fillText(s.obj.tag||'', innerWidth/2, innerHeight/2);
  if(s.paused){
    ctx.fillStyle='#ffd23f';
    ctx.font='bold 14px system-ui, sans-serif';
    ctx.fillText('PAUSED', innerWidth/2, innerHeight/2+14);
  }
  ctx.fillStyle='#e8ecf5';
  ctx.fillRect(innerWidth/2-80, innerHeight/2+20, 160*prog, 6);
  ctx.strokeStyle=C.ink; ctx.lineWidth=1.5;
  ctx.strokeRect(innerWidth/2-80, innerHeight/2+20, 160, 6);
  ctx.font='11px system-ui, sans-serif';
  ctx.fillStyle=C.cream;
  const skipText = s.paused ? 'Esc to resume, E/Space to skip' : 'Esc to pause, E/Space to skip';
  ctx.fillText(reducedMotion?'Press E or Space':skipText, innerWidth/2, innerHeight/2+48);
  ctx.textAlign='left';
  ctx.restore();
}

/* ---------- update ---------- */
let insideB = null, lastInside = null;
function update(){
  const blocked = document.getElementById('modal').classList.contains('on') ||
                  document.getElementById('classic').classList.contains('on') ||
                  document.getElementById('intro').style.display !== 'none' ||
                  !!landmarkSeq;

  updateCritters();
  updateWater();
  if(T%30===0){
    const tx=Math.floor(P.x/TILE), ty=Math.floor(P.y/TILE), tile=map[ty]&&map[ty][tx];
    AudioManager.setBiome(ty<20 && tx>=64 ? 'mountain' : tile===WATER ? 'water' : tile===DESERT ? 'desert' : 'village');
  }
  /* ambient animals: rabbits hop, goats/deer wander like cows */
  for(const r of rabbits){
    r.t--;
    if(r.petting>0) r.petting--;
    if(r.t<=0){
      r.t = 60+Math.random()*180;
      if(Math.random()<0.5){ r.vx=0; r.vy=0; r.hop=0; }
      else {
        const a=Math.random()*Math.PI*2;
        r.vx=Math.cos(a)*0.55; r.vy=Math.sin(a)*0.55;
        if(Math.abs(r.vx)>0.02) r.face=r.vx>0?1:-1;
        r.hop=20+Math.random()*30;
      }
    }
    if(r.hop>0) r.hop--;
    const nx=r.x+r.vx, ny=r.y+r.vy;
    if(walkableForAnimal(Math.floor(nx/TILE),Math.floor(r.y/TILE))) r.x=nx; else r.vx*=-1;
    if(walkableForAnimal(Math.floor(r.x/TILE),Math.floor(ny/TILE))) r.y=ny; else r.vy*=-1;
  }
  for(const g of goats){
    g.t--;
    if(g.petting>0) g.petting--;
    if(g.t<=0){
      g.t=90+Math.random()*220;
      if(Math.random()<0.45){ g.vx=0; g.vy=0; g.graze=60+Math.random()*120; }
      else { const a=Math.random()*Math.PI*2; g.vx=Math.cos(a)*0.18; g.vy=Math.sin(a)*0.18;
        if(Math.abs(g.vx)>0.02) g.face=g.vx>0?1:-1; }
    }
    if(g.graze>0){ g.graze--; continue; }
    const nx=g.x+g.vx, ny=g.y+g.vy;
    if(walkableForAnimal(Math.floor(nx/TILE),Math.floor(g.y/TILE))) g.x=nx; else { g.vx*=-1; g.face=g.vx>0?1:-1; }
    if(walkableForAnimal(Math.floor(g.x/TILE),Math.floor(ny/TILE))) g.y=ny; else g.vy*=-1;
  }
  for(const d2 of deer){
    d2.t--;
    if(d2.petting>0) d2.petting--;
    if(d2.mounted && riding===d2){
      const nx=d2.x+riding.vx, ny=d2.y+riding.vy;
      if(walkableForAnimal(Math.floor(nx/TILE),Math.floor(d2.y/TILE))) d2.x=nx; else riding.vx=0;
      if(walkableForAnimal(Math.floor(d2.x/TILE),Math.floor(ny/TILE))) d2.y=ny; else riding.vy=0;
      continue;
    }
    if(d2.t<=0){
      d2.t=90+Math.random()*220;
      if(Math.random()<0.5){ d2.vx=0; d2.vy=0; d2.graze=60+Math.random()*120; }
      else { const a=Math.random()*Math.PI*2; d2.vx=Math.cos(a)*0.20; d2.vy=Math.sin(a)*0.20;
        if(Math.abs(d2.vx)>0.02) d2.face=d2.vx>0?1:-1; }
    }
    if(d2.graze>0){ d2.graze--; continue; }
    const nx=d2.x+d2.vx, ny=d2.y+d2.vy;
    if(walkableForAnimal(Math.floor(nx/TILE),Math.floor(d2.y/TILE))) d2.x=nx; else { d2.vx*=-1; d2.face=d2.vx>0?1:-1; }
    if(walkableForAnimal(Math.floor(d2.x/TILE),Math.floor(ny/TILE))) d2.y=ny; else d2.vy*=-1;
  }
  for(const c of cows){ if(c.petting>0) c.petting--; if(c.mounted && riding===c){ const nx=c.x+riding.vx, ny=c.y+riding.vy; if(walkableForCow(Math.floor(nx/TILE),Math.floor(c.y/TILE))) c.x=nx; else riding.vx=0; if(walkableForCow(Math.floor(c.x/TILE),Math.floor(ny/TILE))) c.y=ny; else riding.vy=0; } }
  updateLandmarkSeq();
  for(const f of flies){ f.p += 0.02*f.s; f.x += Math.cos(f.p)*0.22; f.y += Math.sin(f.p*1.3)*0.16; }
  if(flyCow.active){
    flyCow.x += 1.5; flyCow.t++;
    if(flyCow.x > innerWidth+80) flyCow.active=false;
  } else if(--flyCow.next<=0){
    flyCow.active=true; flyCow.x=-90; flyCow.y=50+Math.random()*90; flyCow.t=0; flyCow.next=1400+Math.random()*1600;
  }

  if(!blocked){
    let dx=0, dy=0;
    if(keys['a']||keys['arrowleft'])  dx-=1;
    if(keys['d']||keys['arrowright']) dx+=1;
    if(keys['w']||keys['arrowup'])    dy-=1;
    if(keys['s']||keys['arrowdown'])  dy+=1;
    dx += touchVec.x; dy += touchVec.y;
    const len = Math.hypot(dx,dy);
    if(len>1){ dx/=len; dy/=len; }
    P.moving = len>0.08;
    if(riding){
      if(P.moving){
        riding.vx = dx*P.speed*1.8;
        riding.vy = dy*P.speed*1.8;
        if(Math.abs(dx)>Math.abs(dy)) riding.face = dx>0?1:-1;
        P.x = riding.x; P.y = riding.y - 8;
        if(Math.abs(dx)>Math.abs(dy)) P.dir = dx>0?1:3; else P.dir = dy>0?2:0;
        P.anim += 0.2;
      } else { riding.vx=0; riding.vy=0; P.x=riding.x; P.y=riding.y-8; P.anim=0; }
    } else if(P.moving){
      if(R3on){ movePlayer3d(dx,dy); }
      else {
        if(Math.abs(dx)>Math.abs(dy)) P.dir = dx>0?1:3; else P.dir = dy>0?2:0;
        const nx=P.x+dx*P.speed*2, ny=P.y+dy*P.speed*2;
        if(canMove(nx,P.y)) P.x=nx;
        if(canMove(P.x,ny)) P.y=ny;
        P.anim += 0.2;
      }
    } else P.anim = 0;
  } else P.moving = false;

  /* 3D jetpack thrust — runs even without WASD */
  if(R3on && !blocked){
    if(P.alt===undefined){ P.alt=0; P.vy=0; }
    const descend=!!(keys['shift']&&keys['z']);
    const thrust=!descend&&!!keys['z'];
    if(thrust) P.vy=Math.min(P.vy+0.55, 3.6);
    else if(descend) P.vy=Math.max(P.vy-0.8, -5.0);
    else P.vy=0;
    P.alt+=P.vy;
    if(P.alt>FLY_CEIL){ P.alt=FLY_CEIL; P.vy=0; }
    const g=groundHeightAt(P.x,P.y,P.alt);
    const tt=(map[Math.floor(P.y/TILE)]||[])[Math.floor(P.x/TILE)];
    if(tt===WATER && P.alt<2){ P.alt=2; P.vy=0; }
    else if(P.alt<=g){ P.alt=g; if(P.vy<0) P.vy=0; }
    else if(!thrust && !descend && P.vy<=0 && P.alt-g<2.5){ P.alt=g; P.vy=0; }
    P._thrust=thrust;
  }

  /* which building am I in? */
  insideB = insideBuildingAt(Math.floor(P.x/TILE), Math.floor(P.y/TILE));
  if(insideB !== lastInside){
    if(insideB){
      toast(insideB.label); blip(560);
      if(!insideB._entered) track('enter:'+insideB.id);
      insideB._entered=true;
    }
    lastInside = insideB;
  }
  for(const b of BUILDINGS){
    b.at = (b===insideB) ? 0.10 : 1;
    b.a += (b.at - b.a) * 0.16;
  }

  if(bubble && T > bubble.until) bubble = null;
  if(!blocked){ doorChatter(); maybeChatter(); }

  near = findNear();
  const nearA = !riding ? nearAnimal() : null;
  const pr = document.getElementById('prompt');
  if(riding && !blocked){
    pr.style.display='block';
    pr.innerHTML = (matchMedia('(pointer:coarse)').matches ? 'Tap <b>LOOK</b>' : 'Press <b>E</b>')
                 + ' — Dismount';
  } else if(nearA && !blocked){
    pr.style.display='block';
    const canMount = nearA.rideable && nearA.affinity>=3;
    const secondPress = canMount && lastPetAnimal===nearA && (T-lastPetTime)<90;
    const act = secondPress ? 'Ride' : (canMount ? 'Pet (again to ride)' : 'Pet');
    pr.innerHTML = (matchMedia('(pointer:coarse)').matches ? 'Tap <b>LOOK</b>' : 'Press <b>E</b>')
                 + ' — ' + act + ' ' + nearA.name;
  } else if(near && !blocked){
    pr.style.display='block';
    pr.innerHTML = (matchMedia('(pointer:coarse)').matches ? 'Tap <b>LOOK</b>' : 'Press <b>E</b>')
                 + ' — ' + near.label;
  } else pr.style.display='none';

  /* camera with a little lag (2D only; 3D drives its own follow cam) */
  if(!R3on){
    const vw = innerWidth/ZOOM, vh = innerHeight/ZOOM;
    let tx = Math.max(0, Math.min(W-vw, P.x - vw/2));
    let ty = Math.max(0, Math.min(H-vh, P.y - vh/2));
    if(W < vw) tx = (W-vw)/2;
    if(H < vh) ty = (H-vh)/2;
    if(!camInit){ camX=tx; camY=ty; camInit=true; }
    camX += (tx-camX)*0.12; camY += (ty-camY)*0.12;
  }
}

let near = null;
function findNear(){
  if(R3on && (P.alt||0)>26) return null;   // jetpacking high above: nothing in reach
  let best=null, bd=1e9;
  for(const o of objs){
    if(o.home && o.home!==insideB) continue;          // can't read what's under a roof
    const cx=o.x+o.pw/2, cy=o.y+o.ph/2;
    const d=Math.hypot(P.x-cx, P.y-cy);
    const reach = Math.max(o.pw,o.ph)/2 + 22;
    if(d<reach && d<bd){ bd=d; best=o; }
  }
  for(const f of MOUNTAIN_FEATURES){
    const d=Math.hypot(P.x-(f.x+8), P.y-(f.y+8));
    if(d<28 && d<bd){ bd=d; best=f; }
  }
  return best;
}
