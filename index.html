<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd23f'/%3E%3Cpath d='M12 30c0-12 8-19 20-19s20 7 20 19v6c0 12-9 17-20 17s-20-5-20-17z' fill='%23e9b183'/%3E%3Cpath d='M10 26c2-13 10-19 22-19s20 6 22 19c-6-6-14-8-22-8s-16 2-22 8z' fill='%231b1a20'/%3E%3Ccircle cx='23' cy='33' r='8' fill='%23cfe4f2' stroke='%232b2b33' stroke-width='2.5'/%3E%3Ccircle cx='43' cy='33' r='8' fill='%23cfe4f2' stroke='%232b2b33' stroke-width='2.5'/%3E%3Cpath d='M31 32h4M15 31l-4-2M51 31l4-2' stroke='%232b2b33' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='33' r='3' fill='%2333241c'/%3E%3Ccircle cx='43' cy='33' r='3' fill='%2333241c'/%3E%3Cpath d='M26 45q7 5 14 0' stroke='%2333241c' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="appaaz; Campus">
<meta property="og:description" content="A walkable, solarpunk 3D campus by appaaz; - explore our work, services and team.">
<meta property="og:site_name" content="appaaz;">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="appaaz; Campus">
<meta name="twitter:description" content="A walkable, solarpunk 3D campus by appaaz; - explore our work, services and team.">
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-top">
    <div class="hud-left">
      <button class="k" id="hudToggle" aria-expanded="true" title="Show or hide the HUD panels">▴ HUD</button>
      <div class="badge">
        <div><b id="whoami">—</b></div>
        <div id="found" style="color:var(--ink-dim)">Discovered 0 / 0</div>
        <div id="secretsLine" style="color:#8a5a3b;display:none">Secrets 0 / 0</div>
      </div>
      <div class="badge speed">
        <label for="spd">Walk speed <b id="spdVal">1.5×</b></label>
        <input type="range" id="spd" min="0.5" max="3.5" step="0.1" value="1.5"
               aria-label="Walk speed">
      </div>
      <div class="badge speed">
        <label for="camAngle">Camera angle <b id="camAngleVal">22°</b></label>
        <input type="range" id="camAngle" min="10" max="90" step="1" value="22"
               aria-label="Camera angle, 10° low to 90° top-down">
      </div>
      <div class="badge speed">
        <label for="camDist">Camera distance <b id="camDistVal">600</b></label>
        <input type="range" id="camDist" min="200" max="1400" step="10" value="600"
               aria-label="Camera distance, 200 close to 1400 far">
      </div>
    </div>
    <div class="hud-btns">
      <button class="k" id="btnClassic">Text version →</button>
      <button class="k" id="btnHelp">?</button>
      <button class="k" id="btnSound">♪ on</button>
      <div class="audio-control" title="Master audio volume">
        <label for="audioVolume">VOL</label>
        <input id="audioVolume" type="range" min="0" max="1" step="0.05" value="0.55" aria-label="Master audio volume">
      </div>
      </div>
  </div>
  <div id="toast"></div>
  <div id="speech" role="status" aria-live="polite"></div>
  <div id="prompt">Press <b>E</b></div>
  <canvas id="minimap" width="160" height="110"></canvas>
  <div id="touch">
    <div id="stick"><div id="nub"></div></div>
    <button id="abtn">LOOK</button>
    <div id="flypad">
      <button id="flyup" aria-label="Hold to ascend">▲</button>
      <button id="flydown" aria-label="Hold to descend">▼</button>
    </div>
  </div>
</div>

<div id="modal">
  <div class="card">
    <div class="card-head">
      <h2 id="mTitle"></h2><span class="tag" id="mTag"></span>
    </div>
    <div class="card-body" id="mBody"></div>
    <div class="card-foot">ESC or click outside to close</div>
  </div>
</div>

<div id="intro">
  <div class="pollen" aria-hidden="true">
    <span class="pollen-dot" style="width:16px;height:16px;left:12%;top:65%;animation-duration:9s;"></span>
    <span class="pollen-dot" style="width:12px;height:12px;left:28%;top:78%;animation-duration:12s;animation-delay:1.5s;"></span>
    <span class="pollen-dot" style="width:20px;height:20px;left:74%;top:55%;animation-duration:11s;animation-delay:3s;"></span>
    <span class="pollen-dot" style="width:10px;height:10px;left:85%;top:82%;animation-duration:7s;animation-delay:2s;"></span>
    <span class="pollen-dot" style="width:16px;height:16px;left:48%;top:60%;animation-duration:13s;animation-delay:.5s;"></span>
  </div>
  <div class="box">
    <span class="badge-pill"><i></i>appaaz; Campus</span>
    <h1 id="introName">—</h1>
    <div class="keys">
      <div class="key"><b class="k-wasd">W A S D</b><em>/</em><span>Arrows — Pilot Exosuit</span></div>
      <div class="key"><b class="k-e">E</b><em>—</em><span>Inspect Relic</span></div>
      <div class="key"><b class="k-e">Space</b><em>—</em><span>Hold: Jetpack</span></div>
    </div>
    <div class="cta-wrap">
      <button class="k cta" id="btnStart">▶ ENTER THE HABITAT</button>
    </div>
  </div>
  <div class="foot-hud">
    <span id="introSub" class="fh-sub"></span>
  </div>
</div>

<div id="classic">
  <button class="k back" id="btnBackGame">← Back to the game</button>
  <div class="wrap">
    <header><h1 id="cName"></h1><p class="role" id="cRole"></p><p class="blurb" id="cBlurb"></p></header>
    <div id="cSections"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
